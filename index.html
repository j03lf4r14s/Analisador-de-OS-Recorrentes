        filial, assunto:subj.name, diag:subj.diag, status:st, abertura:opening,
        fechamento: st==="Fechada" ? opening + (2+Math.floor(rnd()*40))*3600000 : null,
        day: Math.floor(opening/DAY), fileId});
    });
  });
  return {id:fileId, name:"demonstracao_os_2026.csv", rows, skipped:0, addedAt:Date.now(), demo:true};
}
function demoToCsv(file) {
  const headers = ["IdOs","IdCliente","Clientes","Bairro","Tecnicos","Filial","Assuntos","Diagnostico","DataAberturaOs","DataFechamentoOs","StatusOs"];
  const lines = [headers];
  for (const r of file.rows) lines.push([r.id,r.cid,r.cliente,r.bairro,r.tecnico,r.filial,r.assunto,r.diag,fmtDT(r.abertura),r.fechamento?fmtDT(r.fechamento):"",r.status]);
  return "\uFEFF"+lines.map(l=>l.map(csvCell).join(";")).join("\r\n");
}

/* ---------------- STORAGE ---------------- */
const SETTINGS_KEY = "osAnalyzer.settings.v2";
const FILES_KEY = "osAnalyzer.files.v1";
const Storage = {
  loadSettings() { try { const r = localStorage.getItem(SETTINGS_KEY); return r ? JSON.parse(r) : null; } catch { return null; } },
  saveSettings(s) { try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(s)); } catch {} },
  loadFiles() { try { const r = localStorage.getItem(FILES_KEY); return r ? JSON.parse(r) : []; } catch { return []; } },
  saveFiles(f) { try { localStorage.setItem(FILES_KEY, JSON.stringify(f)); } catch {} },
  clearFiles() { try { localStorage.removeItem(FILES_KEY); } catch {} }
};

/* ---------------- DEFAULT FILTERS ---------------- */
const defaultFilters = () => ({from:"", to:"", win:30, minOs:2, filial:"", bairro:"", status:"", tecnico:"", q:"", selectedSubjects:[]});

/* ============================================================
   COMPONENTS
   ============================================================ */
function App() {
  const stored = useMemo(()=>Storage.loadSettings(), []);
  const [theme, setTheme] = useState(stored?.theme || "dark");
  const [files, setFiles] = useState(() => Storage.loadFiles());
  const [filters, setFilters] = useState(() => {
    const base = defaultFilters();
    const saved = stored?.filters;
    return saved ? {...base, ...saved, selectedSubjects: saved.selectedSubjects || []} : base;
  });
  const [view, setView] = useState(stored?.view || "rec");
  const [sortKey, setSortKey] = useState(stored?.sortKey || "n");
  const [sortAsc, setSortAsc] = useState(stored?.sortAsc ?? false);
  const [presets, setPresets] = useState(stored?.presets || []);
  const [periodTouched, setPeriodTouched] = useState(stored?.periodTouched || false);
  const [loading, setLoading] = useState(false);
  const [errors, setErrors] = useState([]);
  const [restored, setRestored] = useState(false);
  const [toasts, setToasts] = useState([]);
  const [modal, setModal] = useState(null);
  const [presetName, setPresetName] = useState("");
  const [mobileMenu, setMobileMenu] = useState(false);
  const fileInputRef = useRef(null);
  const workspaceRef = useRef(null);
  const toastIdRef = useRef(0);
  const restoredNotified = useRef(false);

  const dataset = useMemo(()=>buildDataset(files), [files]);
  const analysis = useMemo(()=>analyze(dataset.all, filters), [dataset.all, filters]);
  const insights = useMemo(()=>buildInsights(analysis), [analysis]);
  const groups = useMemo(()=>filterAndSort(analysis, view, filters, sortKey, sortAsc), [analysis, view, filters, sortKey, sortAsc]);
  const subjects = useMemo(()=>[...new Set(dataset.all.map(r=>r.assunto))], [dataset.all]);
  const fileNames = useMemo(()=>Object.fromEntries(files.map(f=>[f.id, f.name])), [files]);

  const notify = useCallback((msg, tone="success")=>{
    const id = ++toastIdRef.current;
    setToasts(c=>[...c.slice(-2), {id, message:msg, tone}]);
    setTimeout(()=>setToasts(c=>c.filter(t=>t.id!==id)), 4200);
  }, []);

  const scrollToWorkspace = useCallback(()=>{
    workspaceRef.current?.scrollIntoView({behavior:"smooth", block:"start"});
    setMobileMenu(false);
  }, []);

  useEffect(()=>{ document.documentElement.dataset.theme = theme; document.documentElement.style.colorScheme = theme; }, [theme]);

  // Restore + notify
  useEffect(()=>{
    if (files.length && !restoredNotified.current) {
      restoredNotified.current = true;
      setRestored(true);
      const ds = buildDataset(files);
      const avail = [...new Set(ds.all.map(r=>r.assunto))];
      setFilters(cur=>({...cur,
        from: stored?.periodTouched ? cur.from : ds.minDay==null ? "" : isoDay(ds.minDay),
        to: stored?.periodTouched ? cur.to : ds.maxDay==null ? "" : isoDay(ds.maxDay),
        selectedSubjects: stored?.filters ? cur.selectedSubjects.filter(s=>avail.includes(s)) : avail.filter(s=>!isAfterSales(s))
      }));
      setTimeout(()=>notify("Trabalho restaurado do armazenamento local.", "info"), 300);
    }
  }, []); // eslint-disable-line

  // Persist
  useEffect(()=>{ Storage.saveSettings({theme, filters, view, sortKey, sortAsc, presets, periodTouched}); }, [theme, filters, view, sortKey, sortAsc, presets, periodTouched]);
  useEffect(()=>{ Storage.saveFiles(files); }, [files]);

  // Esc to close modal
  useEffect(()=>{
    if (!modal) return;
    const onKey = e => { if (e.key==="Escape") setModal(null); };
    document.addEventListener("keydown", onKey);
    return ()=>document.removeEventListener("keydown", onKey);
  }, [modal]);

  const updateFilters = (patch)=>{
    setFilters(cur=>({...cur, ...patch}));
    if ("from" in patch || "to" in patch) setPeriodTouched(true);
  };

  const initializeFilters = (nextFiles, preserve=false) => {
    const ds = buildDataset(nextFiles);
    const avail = [...new Set(ds.all.map(r=>r.assunto))];
    setFilters(cur=>({...cur,
      from: preserve && periodTouched ? cur.from : ds.minDay==null ? "" : isoDay(ds.minDay),
      to: preserve && periodTouched ? cur.to : ds.maxDay==null ? "" : isoDay(ds.maxDay),
      filial: preserve ? cur.filial : "", bairro: preserve ? cur.bairro : "",
      tecnico: preserve ? cur.tecnico : "", status: preserve ? cur.status : "", q: preserve ? cur.q : "",
      selectedSubjects: preserve ? cur.selectedSubjects.filter(s=>avail.includes(s)) : avail.filter(s=>!isAfterSales(s))
    }));
    if (!preserve) setPeriodTouched(false);
  };

  const handleFiles = async (incoming)=>{
    const list = Array.from(incoming); if (!list.length || loading) return;
    setLoading(true); setErrors([]);
    const parsed=[]; const errs=[];
    for (const f of list) { try { parsed.push(await parseOsFile(f)); } catch(e){ errs.push(f.name+": "+(e.message||"falha desconhecida.")); } }
    if (parsed.length) {
      const replacingDemo = files.some(f=>f.demo) && parsed.some(f=>!f.demo);
      const base = replacingDemo ? files.filter(f=>!f.demo) : files;
      const next = [...base, ...parsed];
      setFiles(next); setRestored(false); initializeFilters(next, base.length>0); setView("rec");
      notify(parsed.length+" arquivo"+(parsed.length>1?"s":"")+" lido"+(parsed.length>1?"s":"")+" · "+parsed.reduce((s,f)=>s+f.rows.length,0)+" OS válidas."+(replacingDemo?" Demonstração substituída.":""));
      setTimeout(scrollToWorkspace, 80);
    }
    setErrors(errs); setLoading(false);
  };

  const loadDemo = ()=>{
    if (files.some(f=>f.demo)) { scrollToWorkspace(); notify("A demonstração já está carregada.", "info"); return; }
    const demo = createDemoFile();
    setFiles([demo]); setFilters(defaultFilters()); initializeFilters([demo]);
    setRestored(false); setView("rec"); setErrors([]);
    notify("Demonstração carregada: 56 clientes fictícios prontos para investigar.");
    setTimeout(scrollToWorkspace, 100);
  };

  const downloadDemo = ()=>{
    const demo = createDemoFile();
    downloadText(demoToCsv(demo), "modelo_os_recorrencia.csv");
    notify("CSV de exemplo gerado com as colunas compatíveis.");
  };

  const removeFile = (id)=>{
    const next = files.filter(f=>f.id!==id);
    setFiles(next); setRestored(false);
    if (next.length) initializeFilters(next, true);
    else { setFilters(defaultFilters()); setPeriodTouched(false); }
    notify("Arquivo removido. Os resultados foram recalculados.", "info");
  };

  const confirmClear = ()=>{
    setFiles([]); setFilters(defaultFilters()); setPeriodTouched(false);
    setRestored(false); setErrors([]); setModal(null); Storage.clearFiles();
    notify("Dados e resultados removidos deste navegador.", "info");
  };

  const resetFilters = ()=>{
    setFilters({...defaultFilters(),
      from: dataset.minDay==null ? "" : isoDay(dataset.minDay),
      to: dataset.maxDay==null ? "" : isoDay(dataset.maxDay),
      selectedSubjects: subjects.filter(s=>!isAfterSales(s))
    });
    setPeriodTouched(false); setView("rec");
    notify("Filtros restaurados para todo o período, exceto pós-venda.", "info");
  };

  const selectMonth = (month)=>{
    if (!month) return;
    const [y,m] = month.split("-").map(Number);
    updateFilters({from: isoDay(Date.UTC(y,m-1,1)/DAY), to: isoDay(Date.UTC(y,m,0)/DAY)});
  };

  const savePreset = (e)=>{
    e.preventDefault();
    const name = presetName.trim(); if (!name) return;
    const id = (crypto.randomUUID && crypto.randomUUID()) || "p-"+Date.now();
    setPresets(c=>[...c, {id, name, createdAt:Date.now(), filters:{...filters, selectedSubjects:[...filters.selectedSubjects], q:""}}]);
    setPresetName(""); setModal(null);
    notify("Preset “"+name+"” salvo neste navegador.");
  };

  const applyPreset = (id)=>{
    const p = presets.find(x=>x.id===id); if (!p) return;
    setFilters({...defaultFilters(), ...p.filters, selectedSubjects: p.filters.selectedSubjects.filter(s=>subjects.includes(s))});
    setPeriodTouched(true); setView("rec");
    notify("Preset “"+p.name+"” aplicado.");
  };

  const deletePreset = (id)=>{
    const p = presets.find(x=>x.id===id);
    setPresets(c=>c.filter(x=>x.id!==id));
    if (p) notify("Preset “"+p.name+"” excluído.", "info");
  };

  const drilldown = (dim, label)=>{
    if (dim==="assunto") updateFilters({selectedSubjects:[label], q:""});
    else updateFilters({[dim]:label, q:""});
    setView("rec");
    notify("Recorte aplicado: "+label+".", "info");
    setTimeout(()=>document.getElementById("results-title")?.scrollIntoView({behavior:"smooth", block:"start"}), 100);
  };

  const changeView = (v)=>{ setView(v); setTimeout(()=>document.getElementById("results-title")?.scrollIntoView({behavior:"smooth", block:"start"}), 60); };
  const changeSort = (k)=>{ if (sortKey===k) setSortAsc(v=>!v); else { setSortKey(k); setSortAsc(["cliente","bairro","filial"].includes(k)); } };

  const exportResults = ()=>{
    if (!groups.length) return;
    const csv = groupsToCsv(groups, view, analysis.win, fileNames);
    const period = (filters.from||"inicio")+"_a_"+(filters.to||"fim");
    downloadText(csv, "os_"+view+"_"+period+".csv");
    notify("CSV exportado com o resultado completo da visão atual ("+groups.length+" clientes).");
  };

  const hasData = files.length > 0;

  return (
    <div>
      <header className="site-header">
        <a className="brand" href="#inicio">
          <span className="brand-mark"><Icon name="activity" size={21} stroke={2.4} /></span>
          <span className="brand-copy"><strong>OS<span>/</span>Recorrência</strong><small>ANALISADOR OPERACIONAL</small></span>
        </a>
        <nav className={"main-nav"+(mobileMenu?" mobile-open":"")}>
          <a href="#analise" onClick={()=>setMobileMenu(false)}>Análise</a>
          {hasData && <a href="#insights-title" onClick={()=>setMobileMenu(false)}>Padrões</a>}
          <a href="#metodologia" onClick={()=>setMobileMenu(false)}>Metodologia</a>
          <a href="#privacidade" onClick={()=>setMobileMenu(false)}>Privacidade</a>
        </nav>
        <div className="header-actions">
          <span className="header-local"><span /> Dados locais</span>
          {hasData && <button className="button button-small button-header-import" onClick={()=>fileInputRef.current?.click()}><Icon name="file" size={14} /> Adicionar OS</button>}
          <button className="theme-toggle" onClick={()=>setTheme(t=>t==="dark"?"light":"dark")} aria-label="Alternar tema">
            <span key={theme}><Icon name={theme==="dark"?"sun":"moon"} size={17} /></span>
          </button>
          <button className="mobile-menu-button" onClick={()=>setMobileMenu(v=>!v)} aria-label="Abrir menu" aria-expanded={mobileMenu}>
            <Icon name={mobileMenu?"x":"menu"} size={19} />
          </button>
        </div>
      </header>

      <main>
        <div id="inicio">
          <Hero hasData={hasData} windowDays={filters.win} minOs={filters.minOs}
            onImport={()=>fileInputRef.current?.click()} onDemo={loadDemo} onWorkspace={scrollToWorkspace} />
        </div>

        <section className="workspace page-shell" id="analise" ref={workspaceRef}>
          <div className="workspace-intro">
            <div>
              <span className="workspace-kicker"><Icon name="arrow-down" size={14} /> WORKSPACE ANALÍTICO</span>
              <h2>Do relatório bruto à próxima ação.</h2>
            </div>
            <p>Importe, recorte, investigue e exporte. Todas as etapas compartilham o mesmo estado e são recalculadas instantaneamente.</p>
          </div>

          <UploadPanel
            files={files} duplicateByFile={dataset.duplicateByFile} duplicates={dataset.duplicates}
            loading={loading} errors={errors} restored={restored} fileInputRef={fileInputRef}
            onFiles={handleFiles} onBrowse={()=>fileInputRef.current?.click()}
            onRemove={removeFile} onClear={()=>setModal("clear")}
            onDemo={loadDemo} onDownloadDemo={downloadDemo} />

          {hasData ? (
            <>
              <FiltersPanel filters={filters} records={dataset.all} presets={presets}
                onChange={updateFilters} onMonth={selectMonth} onReset={resetFilters}
                onSavePreset={()=>{setPresetName(""); setModal("preset");}}
                onApplyPreset={applyPreset} onDeletePreset={deletePreset} />
              <Kpis analysis={analysis} view={view} onView={changeView} />
              <Insights analysis={analysis} insights={insights} onDrilldown={drilldown} />
              <ResultsTable analysis={analysis} groups={groups} view={view}
                sortKey={sortKey} sortAsc={sortAsc} fileNames={fileNames} hasQuery={Boolean(filters.q)}
                onSort={changeSort} onExport={exportResults} onPrint={()=>window.print()}
                onResetFilters={resetFilters} onClearSearch={()=>updateFilters({q:""})} />
            </>
          ) : (
            <EmptyWorkspace onDemo={loadDemo} onDownloadDemo={downloadDemo} />
          )}
        </section>

        <Methodology windowDays={filters.win} minOs={filters.minOs} onWindowChange={(win)=>updateFilters({win})} />
      </main>

      <footer className="site-footer" id="privacidade">
        <div className="page-shell footer-grid">
          <div className="footer-brand">
            <span className="brand-mark"><Icon name="activity" size={20} /></span>
            <div>
              <strong>OS/Recorrência</strong>
              <p>Um analisador local para transformar histórico de atendimento em investigação operacional.</p>
            </div>
          </div>
          <div className="footer-privacy">
            <Icon name="shield" size={22} />
            <div>
              <strong>Privacidade por arquitetura</strong>
              <p>Não há upload, contas, cookies de rastreamento ou chamadas de análise. Arquivos e resultados permanecem no dispositivo; a persistência usa localStorage do próprio navegador.</p>
            </div>
          </div>
          <div className="footer-meta">
            <span>XLSX · XLS · CSV</span>
            <span>Exportação CSV com BOM UTF-8</span>
            <span>Datas em dias corridos</span>
          </div>
        </div>
        <div className="page-shell footer-bottom">
          <span>Analisador de OS Recorrentes</span>
          <span>Seus dados continuam sendo seus.</span>
        </div>
      </footer>

      <div className="toast-region" aria-live="polite">
        {toasts.map(t=>(
          <div className={"toast toast-"+t.tone} key={t.id}>
            <Icon name={t.tone==="success"?"check":t.tone==="error"?"alert":"info"} size={17} />
            <span>{t.message}</span>
            <button onClick={()=>setToasts(c=>c.filter(x=>x.id!==t.id))} aria-label="Fechar notificação"><Icon name="x" size={14} /></button>
          </div>
        ))}
      </div>

      {modal && (
        <div className="modal-backdrop" onMouseDown={e=>{if (e.target===e.currentTarget) setModal(null);}}>
          <div className="modal-card" role="dialog" aria-modal="true">
            <button className="modal-close icon-button" onClick={()=>setModal(null)} aria-label="Fechar"><Icon name="x" size={17} /></button>
            {modal==="preset" ? (
              <form onSubmit={savePreset}>
                <span className="modal-icon"><Icon name="activity" size={21} /></span>
                <h2>Salvar preset de análise</h2>
                <p>O preset guarda período, janela, mínimo de OS, dimensões e assuntos. A busca não é incluída para facilitar o reaproveitamento.</p>
                <label className="field-label">Nome do preset
                  <input autoFocus required maxLength={48} value={presetName} onChange={e=>setPresetName(e.target.value)} placeholder="Ex.: Reparos críticos · 15 dias" />
                </label>
                <div className="modal-actions">
                  <button className="button button-ghost-dark" type="button" onClick={()=>setModal(null)}>Cancelar</button>
                  <button className="button button-primary" type="submit" disabled={!presetName.trim()}>Salvar preset</button>
                </div>
              </form>
            ) : (
              <div>
                <span className="modal-icon danger"><Icon name="alert" size={21} /></span>
                <h2>Limpar todos os dados?</h2>
                <p>Os arquivos importados e os resultados atuais serão removidos do workspace e do armazenamento local. Seus presets e preferências de tema serão mantidos.</p>
                <div className="modal-actions">
                  <button className="button button-ghost-dark" type="button" onClick={()=>setModal(null)}>Cancelar</button>
                  <button className="button button-danger" type="button" onClick={confirmClear}>Sim, limpar dados</button>
                </div>
              </div>
            )}
          </div>
        </div>
      )}

      <input ref={fileInputRef} type="file" multiple accept=".xlsx,.xls,.csv" style={{display:"none"}}
        onChange={e=>{ handleFiles(e.target.files); e.target.value=""; }} />
    </div>
  );
}

function UploadPanel({files, duplicateByFile, duplicates, loading, errors, restored, fileInputRef, onFiles, onBrowse, onRemove, onClear, onDemo, onDownloadDemo}) {
  const [dragging, setDragging] = useState(false);
  const skipped = files.reduce((s,f)=>s+f.skipped,0);
  const validRows = files.reduce((s,f)=>s+f.rows.length,0);
  const demoLoaded = files.some(f=>f.demo);
  return (
    <section className="panel upload-panel">
      <div className="panel-heading upload-heading">
        <div>
          <span className="section-index">01 / FONTES DE DADOS</span>
          <h2>Relatórios de ordens de serviço</h2>
        </div>
        <div className="local-badge"><Icon name="lock" size={13} /> Processamento 100% local</div>
      </div>
      <div className={"drop-zone"+(dragging?" is-dragging":"")+(files.length?" is-compact":"")}
        onDragEnter={e=>{e.preventDefault(); setDragging(true);}}
        onDragOver={e=>e.preventDefault()}
        onDragLeave={e=>{ if (!e.currentTarget.contains(e.relatedTarget)) setDragging(false); }}
        onDrop={e=>{e.preventDefault(); setDragging(false); onFiles(e.dataTransfer.files);}}
        onClick={onBrowse}
        role="button" tabIndex={0}
        onKeyDown={e=>{ if (e.key==="Enter"||e.key===" ") { e.preventDefault(); onBrowse(); } }}>
        <div className="drop-icon"><Icon name="upload" size={files.length?22:28} /></div>
        <div className="drop-copy">
          <strong>{dragging ? "Solte para adicionar à análise" : files.length ? "Adicionar outros meses ou relatórios" : "Arraste seus relatórios para cá"}</strong>
          <span>{files.length ? "XLSX, XLS ou CSV · OS com IdOs repetido são ignoradas" : "ou clique para selecionar · você pode carregar vários meses de uma vez"}</span>
        </div>
        {!files.length && <span className="drop-action">Selecionar arquivos <Icon name="plus" size={16} /></span>}
        {loading && <div className="loading-veil"><Icon name="loader" className="spin" size={22} /> Lendo e validando arquivos…</div>}
      </div>
      {errors.length > 0 && (
        <div className="error-stack">
          {errors.map(err=><div className="error-message" key={err}><Icon name="alert" size={16} /> <span>{err}</span></div>)}
        </div>
      )}
      {files.length > 0 ? (
        <>
          <div className="file-list" aria-live="polite">
            {files.map(f=>(
              <div className="file-item" key={f.id}>
                <div className="file-type-icon"><Icon name="file" size={19} /></div>
                <div className="file-info">
                  <strong title={f.name}>{f.name}</strong>
                  <span>
                    {fmtNum(f.rows.length)} OS lidas
                    {f.skipped>0 && ` · ${f.skipped} linhas ignoradas`}
                    {(duplicateByFile[f.id]||0)>0 && ` · ${duplicateByFile[f.id]} repetidas`}
                  </span>
                </div>
                {f.demo && <span className="demo-tag">DEMONSTRAÇÃO</span>}
                <button className="icon-button subtle" onClick={()=>onRemove(f.id)} aria-label={"Remover "+f.name}><Icon name="x" size={16} /></button>
              </div>
            ))}
          </div>
          <div className="upload-summary">
            <div className="quality-notes">
              {restored && <span><Icon name="refresh" size={13} /> Trabalho restaurado deste navegador</span>}
              {duplicates>0 && <span><Icon name="database" size={13} /> {duplicates} duplicidades removidas pelo IdOs</span>}
              {skipped>0 && <span><Icon name="alert" size={13} /> {skipped} linhas sem cliente ou data válida</span>}
              {duplicates===0 && skipped===0 && !restored && <span><Icon name="database" size={13} /> {fmtNum(validRows)} registros prontos para deduplicação e análise</span>}
            </div>
            <button className="text-button danger" onClick={onClear}><Icon name="trash" size={14} /> Limpar dados</button>
          </div>
        </>
      ) : (
        <div className="upload-empty-footer">
          <div>
            <span className="empty-footer-label">Ainda não tem um arquivo em mãos?</span>
            <p>Use dados fictícios para conhecer todos os filtros ou baixe o modelo com as colunas esperadas.</p>
          </div>
          <div className="empty-footer-actions">
            <button className="button button-soft" onClick={onDemo} disabled={loading}><Icon name="eye" size={15} /> Carregar demonstração</button>
            <button className="button button-ghost-dark" onClick={onDownloadDemo}><Icon name="download" size={15} /> Baixar CSV de exemplo</button>
          </div>
        </div>
      )}
      {demoLoaded && <p className="demo-disclaimer">Os dados de demonstração são fictícios e servem apenas para explorar o funcionamento do analisador.</p>}
    </section>
  );
}

function FiltersPanel({filters, records, presets, onChange, onMonth, onReset, onSavePreset, onApplyPreset, onDeletePreset}) {
  const [advancedOpen, setAdvancedOpen] = useState(false);
  const [subjectQuery, setSubjectQuery] = useState("");
  const [presetId, setPresetId] = useState("");
  const branches = useMemo(()=>unique(records.map(r=>r.filial)), [records]);
  const neighborhoods = useMemo(()=>unique(records.map(r=>r.bairro)), [records]);
  const statuses = useMemo(()=>unique(records.map(r=>r.status)), [records]);
  const technicians = useMemo(()=>unique(records.map(r=>r.tecnico)), [records]);
  const months = useMemo(()=>unique(records.map(r=>isoDay(r.day).slice(0,7))).sort().reverse(), [records]);
  const hasEmptyBranch = useMemo(()=>records.some(r=>!r.filial), [records]);
  const hasEmptyNeighborhood = useMemo(()=>records.some(r=>!r.bairro), [records]);
  const hasEmptyTechnician = useMemo(()=>records.some(r=>!r.tecnico), [records]);
  const subjectCounts = useMemo(()=>{
    const c = new Map();
    records.forEach(r=>c.set(r.assunto, (c.get(r.assunto)||0)+1));
    return [...c.entries()].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],"pt-BR"));
  }, [records]);
  const visibleSubjects = subjectCounts.filter(([s])=>s.toLocaleLowerCase("pt-BR").includes(subjectQuery.toLocaleLowerCase("pt-BR")));
  const allSubjects = subjectCounts.map(([s])=>s);
  const activeAdvanced = [filters.filial, filters.bairro, filters.status, filters.tecnico].filter(Boolean).length;
  const month = useMemo(()=>{
    if (!filters.from || !filters.to) return "";
    const fm = filters.from.slice(0,7), tm = filters.to.slice(0,7);
    if (fm !== tm) return "";
    if (filters.from.slice(8,10) !== "01") return "";
    const [y,mm] = fm.split("-").map(Number);
    const lastDay = new Date(Date.UTC(y,mm,0)).getUTCDate();
    if (filters.to.slice(8,10) !== String(lastDay).padStart(2,"0")) return "";
    return fm;
  }, [filters.from, filters.to]);

  return (
    <section className="panel filters-panel">
      <div className="panel-heading filters-heading">
        <div>
          <span className="section-index">02 / RECORTE DA ANÁLISE</span>
          <h2><Icon name="filter" size={19} /> Filtros e regra de recorrência</h2>
        </div>
        <div className="filter-header-actions">
          <div className="preset-control">
            <Icon name="bookmark" size={14} />
            <select value={presetId} onChange={e=>{setPresetId(e.target.value); if (e.target.value) onApplyPreset(e.target.value);}}>
              <option value="">Presets salvos</option>
              {presets.map(p=><option value={p.id} key={p.id}>{p.name}</option>)}
            </select>
            {presetId && <button className="icon-button subtle" onClick={()=>{onDeletePreset(presetId); setPresetId("");}}><Icon name="trash" size={14} /></button>}
          </div>
          <button className="button button-small button-ghost-dark" onClick={onSavePreset}><Icon name="save" size={14} /> Salvar preset</button>
          <button className="icon-button subtle" onClick={()=>{setPresetId(""); onReset();}} title="Restaurar filtros"><Icon name="refresh" size={16} /></button>
        </div>
      </div>
      <div className="filters-grid">
        <label className="field-label">Mês (atalho)
          <select value={month} onChange={e=>onMonth(e.target.value)}>
            <option value="">Período personalizado</option>
            {months.map(v=><option value={v} key={v}>{formatMonth(v)}</option>)}
          </select>
        </label>
        <label className="field-label">Início da abertura
          <input type="date" value={filters.from} onChange={e=>onChange({from:e.target.value})} />
        </label>
        <label className="field-label">Fim da abertura
          <input type="date" value={filters.to} onChange={e=>onChange({to:e.target.value})} />
        </label>
        <label className="field-label">Janela (dias corridos)
          <input type="number" min="1" max="3650" value={filters.win} onChange={e=>onChange({win:Math.max(1, Number(e.target.value)||1)})} />
        </label>
        <label className="field-label">Mínimo de OS
          <input type="number" min="2" max="99" value={filters.minOs} onChange={e=>onChange({minOs:Math.max(2, Number(e.target.value)||2)})} />
        </label>
        <label className="field-label">Filial
          <select value={filters.filial} onChange={e=>onChange({filial:e.target.value})}>
            <option value="">Todas as filiais</option>
            {hasEmptyBranch && <option value="(sem filial)">(sem filial)</option>}
            {branches.map(v=><option value={v} key={v}>{v}</option>)}
          </select>
        </label>
        <label className="field-label search-field">Buscar cliente, ID ou OS
          <span className="input-with-icon">
            <Icon name="search" size={15} />
            <input type="search" placeholder="Ex.: 7100 ou Almeida" value={filters.q} onChange={e=>onChange({q:e.target.value})} />
            {filters.q && <button onClick={()=>onChange({q:""})} aria-label="Limpar busca"><Icon name="x" size={14} /></button>}
          </span>
        </label>
      </div>
      {filters.from && filters.to && filters.from > filters.to && <p className="inline-warning">A data inicial é posterior à data final.</p>}
      <div className="window-shortcuts">
        <span>Janelas frequentes</span>
        {[7,15,30,45,60].map(d=><button key={d} className={filters.win===d?"active":""} onClick={()=>onChange({win:d})}>{d} dias</button>)}
      </div>
      <button className="advanced-toggle" onClick={()=>setAdvancedOpen(v=>!v)} aria-expanded={advancedOpen}>
        <Icon name="sliders" size={15} /> Mais filtros
        {activeAdvanced>0 && <span className="active-filter-count">{activeAdvanced}</span>}
        <Icon name={advancedOpen?"chevron-up":"chevron-down"} size={15} />
      </button>
      {advancedOpen && (
        <div className="advanced-filters">
          <div className="advanced-filters-inner">
            <label className="field-label">Bairro
              <select value={filters.bairro} onChange={e=>onChange({bairro:e.target.value})}>
                <option value="">Todos os bairros</option>
                {hasEmptyNeighborhood && <option value="(sem bairro)">(sem bairro)</option>}
                {neighborhoods.map(v=><option value={v} key={v}>{v}</option>)}
              </select>
            </label>
            <label className="field-label">Técnico
              <select value={filters.tecnico} onChange={e=>onChange({tecnico:e.target.value})}>
                <option value="">Todos os técnicos</option>
                {hasEmptyTechnician && <option value="(sem técnico)">(sem técnico)</option>}
                {technicians.map(v=><option value={v} key={v}>{v}</option>)}
              </select>
            </label>
            <label className="field-label">Status da OS
              <select value={filters.status} onChange={e=>onChange({status:e.target.value})}>
                <option value="">Todos os status</option>
                {statuses.map(v=><option value={v} key={v}>{v}</option>)}
              </select>
            </label>
          </div>
        </div>
      )}
      {activeAdvanced>0 && (
        <div className="active-filter-chips">
          {[["filial","Filial",filters.filial],["bairro","Bairro",filters.bairro],["tecnico","Técnico",filters.tecnico],["status","Status",filters.status]]
            .filter(([,,v])=>v).map(([k,label,value])=>(
              <button key={k} onClick={()=>onChange({[k]:""})}>{label}: <strong>{value}</strong><Icon name="x" size={12} /></button>
            ))}
        </div>
      )}
      <details className="subject-filter" open>
        <summary>
          <span>Assuntos considerados <strong>{filters.selectedSubjects.length} de {allSubjects.length}</strong></span>
          <Icon name="chevron-up" size={16} />
        </summary>
        <div className="subject-actions">
          <button onClick={()=>onChange({selectedSubjects:allSubjects})}>Todos</button>
          <button onClick={()=>onChange({selectedSubjects:allSubjects.filter(s=>isRepair(s)&&!isAfterSales(s))})}>Só reparos</button>
          <button onClick={()=>onChange({selectedSubjects:allSubjects.filter(s=>!isAfterSales(s))})}>Sem pós-venda</button>
          <button onClick={()=>onChange({selectedSubjects:[]})}>Nenhum</button>
          {subjectCounts.length>8 && <label className="subject-search"><Icon name="search" size={13} /><input value={subjectQuery} onChange={e=>setSubjectQuery(e.target.value)} placeholder="Filtrar assuntos" /></label>}
        </div>
        <div className="subject-chips">
          {visibleSubjects.map(([sub,count])=>{
            const sel = filters.selectedSubjects.includes(sub);
            return (
              <label className={"subject-chip"+(sel?" selected":"")} key={sub}>
                <input type="checkbox" checked={sel} onChange={()=>onChange({selectedSubjects: sel ? filters.selectedSubjects.filter(x=>x!==sub) : [...filters.selectedSubjects, sub]})} />
                <span className="chip-check">{sel && <Icon name="check" size={10} stroke={3} />}</span>
                <span>{sub}</span>
                <small>{count}</small>
              </label>
            );
          })}
          {visibleSubjects.length===0 && <span className="muted-copy">Nenhum assunto corresponde à busca.</span>}
        </div>
        {filters.selectedSubjects.length===0 && <p className="inline-warning">Selecione ao menos um assunto para gerar resultados.</p>}
      </details>
      <div className="rule-callout">
        <span className="rule-symbol">&lt;</span>
        <p><strong>Regra aplicada:</strong> considera OS abertas entre {filters.from ? formatDateInput(filters.from) : "a primeira data"} e {filters.to ? formatDateInput(filters.to) : "a última data"}, inclusive. Um cliente entra na lista quando possui pelo menos <strong>{filters.minOs} OS envolvidas</strong> em intervalos consecutivos <strong>menores que {filters.win} dias</strong>, pela data e não pela hora.</p>
      </div>
    </section>
  );
}
function unique(vals){ return [...new Set(vals.filter(Boolean))].sort((a,b)=>a.localeCompare(b,"pt-BR")); }
function formatMonth(v){ const [y,m] = v.split("-").map(Number);
  const label = new Intl.DateTimeFormat("pt-BR",{month:"long",year:"numeric",timeZone:"UTC"}).format(new Date(Date.UTC(y,m-1,1)));
  return label.charAt(0).toUpperCase()+label.slice(1); }
function formatDateInput(v){ const [y,m,d] = v.split("-"); return d+"/"+m+"/"+y; }

function Kpis({analysis, view, onView}) {
  const osHit = analysis.res.reduce((s,g)=>s+g.n,0);
  const pct = analysis.clients ? analysis.res.length/analysis.clients*100 : 0;
  const cards = [
    {id:"rec", target:"rec", value:fmtNum(analysis.res.length), label:"clientes com recorrência", detail:`${analysis.minOs}+ OS em intervalos < ${analysis.win} dias`, icon:"users", tone:"cyan"},
    {id:"oshit", target:"oshit", value:fmtNum(osHit), label:"OS envolvidas na recorrência", detail:`${fmtNum(analysis.res.reduce((s,g)=>s+g.pairCount,0))} conexões entre OS próximas`, icon:"layers", tone:"violet"},
    {id:"allc", target:"allc", value:fmtNum(analysis.clients), label:"clientes com OS no filtro", detail:"base total do recorte selecionado", icon:"users", tone:"blue"},
    {id:"pct", target:"rec", value:fmtNum(pct,1)+"%", label:"índice de recorrência", detail:`${fmtNum(analysis.res.length)} de ${fmtNum(analysis.clients)} clientes`, icon:"percent", tone:"pink"},
    {id:"allos", target:"allos", value:fmtNum(analysis.osInRange), label:"OS no período e filtros", detail:"depois de assuntos e dimensões", icon:"file", tone:"green"}
  ];
  return (
    <section className="kpi-section">
      <div className="results-section-heading">
        <div><span className="section-index">03 / LEITURA EXECUTIVA</span><h2>O recorte em números</h2></div>
        <span>Clique em um indicador para abrir a lista correspondente</span>
      </div>
      <div className="kpi-grid">
        {cards.map((c,i)=>{
          const active = view===c.target && c.id!=="pct";
          return (
            <button key={c.id} className={"kpi-card tone-"+c.tone+(active?" active":"")} onClick={()=>onView(c.target)} aria-pressed={active}>
              <span className="kpi-topline"><Icon name={c.icon} size={17} /><span>0{i+1}</span></span>
              <strong>{c.value}</strong>
              <span className="kpi-label">{c.label}</span>
              <span className="kpi-detail">{c.detail}</span>
            </button>
          );
        })}
      </div>
    </section>
  );
}

function Insights({analysis, insights, onDrilldown}) {
  const [selectedMonth, setSelectedMonth] = useState(null);
  const [dimension, setDimension] = useState("assunto");
  const activePoint = insights.timeline.find(p=>p.key===selectedMonth) || insights.timeline[insights.timeline.length-1];
  const maxTimeline = Math.max(1, ...insights.timeline.flatMap(p=>[p.clients, p.osHit]));
  const maxGap = Math.max(1, ...insights.gapBins.map(b=>b.count));
  const rankings = (insights.rankings[dimension]||[]).slice(0,7);
  const maxRanking = Math.max(1, ...rankings.map(r=>r.clients));
  const totalPairs = analysis.res.reduce((s,g)=>s+g.pairCount,0);
  const topSubject = insights.rankings.assunto[0];
  const dimLabels = {assunto:"Assunto", filial:"Filial", tecnico:"Técnico", bairro:"Bairro"};
  return (
    <section className="insights-section" id="insights-title">
      <div className="results-section-heading">
        <div><span className="section-index">04 / PADRÕES DO RECORTE</span><h2>Onde a recorrência se concentra</h2></div>
        <span>Gráficos e rankings acompanham os filtros em tempo real</span>
      </div>
      <div className="insights-layout">
        <article className="panel insight-card timeline-panel">
          <div className="insight-card-header">
            <div><span className="insight-icon"><Icon name="calendar" size={17} /></span><div><h3>Evolução mensal</h3><p>Clientes e OS envolvidas em recorrência</p></div></div>
            <div className="chart-legend"><span><i className="legend-clients" /> Clientes</span><span><i className="legend-os" /> OS</span></div>
          </div>
          {insights.timeline.length ? (
            <>
              <div className="timeline-scroll">
                <div className="timeline-chart" style={{minWidth:Math.max(420, insights.timeline.length*74)+"px"}}>
                  <div className="chart-gridlines"><span /><span /><span /><span /></div>
                  {insights.timeline.map(p=>(
                    <button key={p.key} className={"timeline-column"+(activePoint?.key===p.key?" selected":"")}
                      onMouseEnter={()=>setSelectedMonth(p.key)} onFocus={()=>setSelectedMonth(p.key)} onClick={()=>setSelectedMonth(p.key)}>
                      <span className="timeline-value">{p.osHit||""}</span>
                      <span className="bars-wrap">
                        <i className="bar-clients" style={{height:(p.clients/maxTimeline*100)+"%"}} />
                        <i className="bar-os" style={{height:(p.osHit/maxTimeline*100)+"%"}} />
                      </span>
                      <span className="timeline-label">{p.label}</span>
                    </button>
                  ))}
                </div>
              </div>
              {activePoint && (
                <div className="chart-readout">
                  <strong>{activePoint.label}</strong>
                  <span>{activePoint.clients} clientes recorrentes</span>
                  <span>{activePoint.osHit} OS envolvidas</span>
                  <span>{activePoint.totalOs} OS no total</span>
                </div>
              )}
            </>
          ) : <div className="empty-chart"><Icon name="info" size={24} /><span>Nenhuma recorrência neste recorte.</span></div>}
        </article>

        <article className="panel insight-card ranking-panel">
          <div className="insight-card-header">
            <div><span className="insight-icon violet"><Icon name="bar-chart" size={17} /></span><div><h3>Fatores associados</h3><p>Clique para aplicar o recorte</p></div></div>
          </div>
          <div className="dimension-tabs" role="tablist">
            {Object.keys(dimLabels).map(k=>(
              <button key={k} className={dimension===k?"active":""} role="tab" aria-selected={dimension===k} onClick={()=>setDimension(k)}>{dimLabels[k]}</button>
            ))}
          </div>
          <div className="ranking-list">
            {rankings.map((r,i)=>(
              <button key={r.label} className="ranking-row" onClick={()=>onDrilldown(dimension, r.label)}>
                <span className="ranking-position">{String(i+1).padStart(2,"0")}</span>
                <span className="ranking-content">
                  <span className="ranking-label"><strong>{r.label}</strong><small>{r.clients} clientes · {r.os} OS</small></span>
                  <span className="ranking-track"><i style={{width:(r.clients/maxRanking*100)+"%"}} /></span>
                </span>
                <Icon name="chevron-right" size={14} />
              </button>
            ))}
            {!rankings.length && <div className="empty-chart compact"><span>Sem dados.</span></div>}
          </div>
        </article>

        <article className="panel insight-card gap-panel">
          <div className="insight-card-header">
            <div><span className="insight-icon green"><Icon name="clock" size={17} /></span><div><h3>Distância entre as OS</h3><p>Apenas conexões menores que {analysis.win} dias</p></div></div>
            <span className="chart-total">{fmtNum(totalPairs)} pares</span>
          </div>
          <div className="gap-chart">
            {insights.gapBins.map((b,i)=>(
              <div className="gap-row" key={i}>
                <span className="gap-label">{b.label}<small> dias</small></span>
                <span className="gap-track"><i style={{width:(b.count/maxGap*100)+"%"}} /></span>
                <strong>{b.count}</strong>
              </div>
            ))}
          </div>
          <div className="gap-axis"><span>mais imediato</span><span>perto do limite da janela</span></div>
        </article>

        <article className="panel insight-card pattern-panel">
          <div className="insight-card-header">
            <div><span className="insight-icon pink"><Icon name="activity" size={17} /></span><div><h3>Leitura dos padrões</h3><p>Sinais objetivos para priorizar</p></div></div>
          </div>
          <div className="pattern-stats">
            <div><span>Intervalo mediano</span><strong>{insights.medianGap==null?"—":fmtNum(insights.medianGap,1)+" dias"}</strong></div>
            <div><span>Intervalo médio</span><strong>{insights.avgGap==null?"—":fmtNum(insights.avgGap,1)+" dias"}</strong></div>
            <div><span>Pares no mesmo dia</span><strong>{fmtNum(insights.sameDay)}</strong></div>
            <div><span>Maior ciclo</span><strong>{insights.longestEpisode?insights.longestEpisode+" OS":"—"}</strong></div>
          </div>
          <div className="pattern-note">
            <Icon name="info" size={16} />
            <p>{buildPatternNote(insights, topSubject?.label)}</p>
          </div>
        </article>
      </div>
    </section>
  );
}
function buildPatternNote(i, topSubject) {
  if (i.sameDay>0) return i.sameDay+" par"+(i.sameDay>1?"es":"")+" foi aberto no mesmo dia. Vale verificar se são atendimentos complementares ou registros operacionais distintos antes de tratar todos como nova falha.";
  if (i.medianGap!=null && i.medianGap<=7) return "Metade das conexões acontece em até "+fmtNum(i.medianGap,1)+" dias"+(topSubject?`, com destaque para “${topSubject}”`:"")+". Priorize a revisão de diagnóstico e fechamento desses atendimentos.";
  if (topSubject) return `“${topSubject}” aparece no maior número de clientes recorrentes. Use o ranking para isolar o assunto e comparar os ciclos na tabela detalhada.`;
  return "Amplie a janela ou selecione mais assuntos para revelar conexões entre ordens de serviço neste recorte.";
}

function ResultsTable({analysis, groups, view, sortKey, sortAsc, fileNames, hasQuery, onSort, onExport, onPrint, onResetFilters, onClearSearch}) {
  const [open, setOpen] = useState(new Set());
  const [page, setPage] = useState(1);
  const [pageSize, setPageSize] = useState(25);
  const flat = view==="oshit" || view==="allos";
  const pageCount = Math.max(1, Math.ceil(groups.length/pageSize));
  const pageGroups = groups.slice((page-1)*pageSize, page*pageSize);
  const visibleCount = view==="oshit" ? groups.reduce((s,g)=>s+g.n,0) : view==="allos" ? groups.reduce((s,g)=>s+g.total,0) : groups.length;
  const allOpen = groups.length>0 && groups.every(g=>open.has(g.cid));

  useEffect(()=>{ setPage(1); setOpen(new Set()); }, [view, analysis]);
  useEffect(()=>{ if (page>pageCount) setPage(pageCount); }, [page, pageCount]);

  const title = view==="rec" ? `Clientes com ${analysis.minOs}+ OS em intervalos < ${analysis.win} dias`
    : view==="oshit" ? "OS envolvidas na recorrência"
    : view==="allc" ? "Todos os clientes com OS no filtro"
    : "Todas as OS no período e filtros";

  const toggle = (cid)=>{ setOpen(c=>{ const n=new Set(c); if (n.has(cid)) n.delete(cid); else n.add(cid); return n; }); };

  const columns = [
    {key:"cliente", label:"Cliente"}, {key:"bairro", label:"Bairro"}, {key:"filial", label:"Filial"},
    {key:"n", label:"OS na janela", num:true}, {key:"total", label:"OS no período", num:true},
    {key:"episodes", label:"Ciclos", num:true}, {key:"minGap", label:"Menor intervalo", num:true},
    {key:"last", label:"Última recorrência"}
  ];

  return (
    <section className="panel results-panel">
      <div className="results-header">
        <div>
          <span className="section-index">05 / INVESTIGAÇÃO DETALHADA</span>
          <h2 id="results-title">{title}</h2>
          <p aria-live="polite">{fmtNum(visibleCount)} {flat?"ordens de serviço":"clientes"} nesta visão{hasQuery?" · busca aplicada":""}</p>
        </div>
        <div className="results-actions">
          {!flat && <button className="button button-small button-ghost-dark" onClick={()=>setOpen(allOpen?new Set():new Set(groups.map(g=>g.cid)))} disabled={!groups.length}><Icon name="chevron-down" size={15} /> {allOpen?"Recolher todos":"Expandir todos"}</button>}
          <button className="button button-small button-ghost-dark print-button" onClick={onPrint} disabled={!groups.length}><Icon name="printer" size={15} /> Imprimir</button>
          <button className="button button-small button-primary" onClick={onExport} disabled={!groups.length}><Icon name="download" size={15} /> Exportar CSV</button>
        </div>
      </div>
      <div className="table-scroll">
        {flat ? (
          <FlatTable groups={pageGroups} onlyHit={view==="oshit"} win={analysis.win} fileNames={fileNames} hasQuery={hasQuery} onResetFilters={onResetFilters} onClearSearch={onClearSearch} />
        ) : (
          <table className="data-table grouped-table">
            <thead><tr>
              <th className="expand-column"><span className="sr-only">Expandir</span></th>
              {columns.map(c=>(
                <th key={c.key} className={c.num?"numeric":""} aria-sort={sortKey===c.key?(sortAsc?"ascending":"descending"):"none"}>
                  <button className={sortKey===c.key?"sorted":""} onClick={()=>onSort(c.key)}>
                    {c.label}{sortKey===c.key ? <Icon name={sortAsc?"arrow-up":"arrow-down"} size={12} /> : <Icon name="arrow-up-down" size={11} />}
                  </button>
                </th>
              ))}
            </tr></thead>
            <tbody>
              {pageGroups.map(g=>(
                <GroupRows key={g.cid} group={g} isOpen={open.has(g.cid)} onToggle={()=>toggle(g.cid)} win={analysis.win} fileNames={fileNames} />
              ))}
              {!pageGroups.length && <EmptyRow colSpan={9} hasQuery={hasQuery} onResetFilters={onResetFilters} onClearSearch={onClearSearch} />}
            </tbody>
          </table>
        )}
      </div>
      <div className="table-footer">
        <div className="table-legend">
          <span><i className="legend-hit" /> Dentro da regra</span>
          <span><i className="legend-out" /> Fora da regra</span>
          <span>Intervalos em dias corridos</span>
        </div>
        <div className="pagination">
          <label>Linhas por página
            <select value={pageSize} onChange={e=>{setPageSize(Number(e.target.value)); setPage(1);}}>
              {[10,25,50,100].map(s=><option key={s} value={s}>{s}</option>)}
            </select>
          </label>
          <span>{groups.length ? `${(page-1)*pageSize+1}–${Math.min(page*pageSize, groups.length)} de ${groups.length}` : "0 de 0"}</span>
          <button className="icon-button" disabled={page<=1} onClick={()=>setPage(v=>v-1)} aria-label="Anterior"><Icon name="chevron-left" size={17} /></button>
          <span className="page-number">{page} / {pageCount}</span>
          <button className="icon-button" disabled={page>=pageCount} onClick={()=>setPage(v=>v+1)} aria-label="Próxima"><Icon name="chevron-right" size={17} /></button>
        </div>
      </div>
    </section>
  );
}

function GroupRows({group, isOpen, onToggle, win, fileNames}) {
  return (
    <>
      <tr className={"main-row"+(isOpen?" open":"")} onClick={onToggle}
        onKeyDown={e=>{ if (e.target===e.currentTarget && (e.key==="Enter"||e.key===" ")) { e.preventDefault(); onToggle(); } }}
        tabIndex={0}>
        <td className="expand-column"><button className="expand-button" onClick={e=>{e.stopPropagation(); onToggle();}} aria-expanded={isOpen}><Icon name="chevron-right" size={16} /></button></td>
        <td><strong className="client-name">{group.cliente}</strong><span className="cell-subtitle">ID {group.cid}</span></td>
        <td>{group.bairro||"—"}</td>
        <td>{group.filial||"—"}</td>
        <td className="numeric">{group.rec ? <span className="count-pill">{group.n}</span> : group.n}</td>
        <td className="numeric">{group.total}</td>
        <td className="numeric">{group.episodes.length||"—"}</td>
        <td className="numeric">{group.minGap==null?"—":`${group.minGap} d`}</td>
        <td>{group.last==null?"—":fmtDay(group.last)}</td>
      </tr>
      {isOpen && (
        <tr className="detail-row"><td colSpan={9}>
          <div className="detail-animation">
            <div className="episode-strip">
              <span className="episode-strip-title">Ciclos identificados</span>
              {group.episodes.length ? group.episodes.map((ep,i)=>(
                <div className="episode-chip" key={i}>
                  <strong>Ciclo {i+1}</strong>
                  <span>{ep.count} OS · {fmtDay(group.list[ep.start].day)} – {fmtDay(group.list[ep.end].day)}</span>
                  <small>menor intervalo {ep.minGap} d</small>
                </div>
              )) : <span className="muted-copy">Nenhum ciclo dentro da janela.</span>}
            </div>
            <div className="inner-table-scroll">
              <table className="data-table inner-table">
                <thead><tr><th>IdOs</th><th>Abertura</th><th className="numeric">Desde a anterior</th><th>Assunto</th><th>Diagnóstico</th><th>Técnico</th><th>Status</th><th>Fechamento</th><th>Origem</th></tr></thead>
                <tbody>
                  {group.list.map((rec,i)=>(
                    <tr key={i} className={group.hit[i]?"os-hit":"os-dim"}>
                      <td className="mono">{rec.id||"—"}</td>
                      <td className="nowrap">{fmtDT(rec.abertura)}</td>
                      <td className="numeric"><span className={group.gaps[i]!=null && group.gaps[i]<win?"gap-value":""}>{group.gaps[i]==null?"—":group.gaps[i]===0?"mesmo dia":`${group.gaps[i]} d`}</span></td>
                      <td>{rec.assunto}</td>
                      <td className="diagnostic-cell">{rec.diag||"—"}</td>
                      <td>{rec.tecnico||"—"}</td>
                      <td><span className={"status-tag"+(rec.status==="Fechada"?" closed":"")}>{rec.status||"—"}</span></td>
                      <td className="nowrap">{fmtDT(rec.fechamento)}</td>
                      <td className="origin-cell" title={fileNames[rec.fileId]||rec.fileId}>{fileNames[rec.fileId]||rec.fileId}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
            <p className="detail-note">Linhas destacadas participam de ao menos um intervalo menor que {win} dias. Linhas apagadas estão fora da regra.</p>
          </div>
        </td></tr>
      )}
    </>
  );
}

function FlatTable({groups, onlyHit, win, fileNames, hasQuery, onResetFilters, onClearSearch}) {
  const rows = groups.flatMap(g=>g.list.map((rec,i)=>({g, rec, i}))).filter(({g,i})=>!onlyHit || g.hit[i]);
  return (
    <table className="data-table flat-table">
      <thead><tr><th>Cliente</th><th>Bairro</th><th>Filial</th><th>IdOs</th><th>Abertura</th><th className="numeric">Desde a anterior</th><th>Assunto</th><th>Diagnóstico</th><th>Técnico</th><th>Status</th><th>Origem</th></tr></thead>
      <tbody>
        {rows.map(({g, rec, i})=>(
          <tr key={g.cid+"-"+i} className={g.hit[i]?"os-hit":"os-dim"}>
            <td><strong className="client-name">{g.cliente}</strong><span className="cell-subtitle">ID {g.cid}</span></td>
            <td>{g.bairro||"—"}</td>
            <td>{g.filial||"—"}</td>
            <td className="mono">{rec.id||"—"}</td>
            <td className="nowrap">{fmtDT(rec.abertura)}</td>
            <td className="numeric"><span className={g.gaps[i]!=null && g.gaps[i]<win?"gap-value":""}>{g.gaps[i]==null?"—":g.gaps[i]===0?"mesmo dia":`${g.gaps[i]} d`}</span></td>
            <td>{rec.assunto}</td>
            <td className="diagnostic-cell">{rec.diag||"—"}</td>
            <td>{rec.tecnico||"—"}</td>
            <td><span className={"status-tag"+(rec.status==="Fechada"?" closed":"")}>{rec.status||"—"}</span></td>
            <td className="origin-cell">{fileNames[rec.fileId]||rec.fileId}</td>
          </tr>
        ))}
        {!rows.length && <EmptyRow colSpan={11} hasQuery={hasQuery} onResetFilters={onResetFilters} onClearSearch={onClearSearch} />}
      </tbody>
    </table>
  );
}

function EmptyRow({colSpan, hasQuery, onResetFilters, onClearSearch}) {
  return (
    <tr><td colSpan={colSpan}>
      <div className="empty-results">
        <Icon name="file-search" size={28} />
        <strong>Nenhum resultado nesta visão</strong>
        <p>{hasQuery ? "A busca não corresponde a nenhum cliente, IdCliente ou IdOs." : "Tente ampliar o período ou a janela, reduzir o mínimo de OS ou selecionar outros assuntos."}</p>
        <button className="button button-soft" onClick={hasQuery ? onClearSearch : onResetFilters}>
          <Icon name="refresh" size={14} /> {hasQuery ? "Limpar busca" : "Restaurar filtros"}
        </button>
      </div>
    </td></tr>
  );
}

function EmptyWorkspace({onDemo, onDownloadDemo}) {
  return (
    <div className="empty-workspace-grid">
      <article className="panel empty-guide">
        <span className="section-index">O QUE ACONTECE DEPOIS DO UPLOAD</span>
        <h3>Uma análise completa, não apenas uma contagem.</h3>
        <div className="guide-steps">
          <div><span>01</span><p><strong>Detecte clientes recorrentes</strong> com janela e quantidade mínima configuráveis.</p></div>
          <div><span>02</span><p><strong>Investigue cada ciclo</strong> com datas, intervalos, diagnóstico, técnico e origem.</p></div>
          <div><span>03</span><p><strong>Encontre concentrações</strong> por assunto, filial, bairro, técnico e mês.</p></div>
          <div><span>04</span><p><strong>Leve o resultado para a operação</strong> em CSV ou impressão, sem expor a base.</p></div>
        </div>
        <div className="empty-guide-actions">
          <button className="button button-primary" onClick={onDemo}>Explorar com dados fictícios</button>
          <button className="button button-ghost-dark" onClick={onDownloadDemo}>Baixar modelo CSV</button>
        </div>
      </article>
      <article className="panel schema-card">
        <span className="section-index">ESTRUTURA RECONHECIDA</span>
        <h3>Colunas do relatório</h3>
        <p>O cabeçalho pode estar em uma das primeiras 20 linhas. Acentos, espaços e variações de caixa são normalizados.</p>
        <div className="schema-list">
          <div><code>IdCliente</code><span>obrigatória</span><p>Agrupa as OS do mesmo cliente.</p></div>
          <div><code>DataAberturaOs</code><span>obrigatória</span><p>Define o período e os intervalos.</p></div>
          <div><code>IdOs</code><span>recomendada</span><p>Remove duplicidades entre arquivos.</p></div>
          <div><code>Clientes · Assuntos</code><span>análise</span><p>Identifica o cliente e recorta causas.</p></div>
          <div><code>Filial · Bairro · Tecnicos</code><span>análise</span><p>Alimenta filtros e rankings.</p></div>
          <div><code>Diagnostico · StatusOs</code><span>detalhe</span><p>Dá contexto à investigação.</p></div>
        </div>
      </article>
    </div>
  );
}

function Methodology({windowDays, minOs, onWindowChange}) {
  const gaps = [7,17];
  const hits = [gaps[0]<windowDays, gaps[0]<windowDays||gaps[1]<windowDays, gaps[1]<windowDays];
  const qualifies = hits.filter(Boolean).length >= minOs;
  return (
    <section className="methodology-section" id="metodologia">
      <div className="page-shell">
        <div className="method-heading">
          <div>
            <span className="section-index">06 / METODOLOGIA TRANSPARENTE</span>
            <h2>Uma regra simples.<br /><em>Nenhuma caixa-preta.</em></h2>
          </div>
          <p>O analisador compara datas de abertura dentro do recorte, sem inferências externas ou pontuação opaca. Você pode testar a lógica abaixo e conferir cada intervalo na tabela.</p>
        </div>
        <div className="method-grid">
          <div className="rule-lab panel">
            <div className="rule-lab-header">
              <div>
                <span className="insight-icon"><Icon name="activity" size={17} /></span>
                <div><h3>Laboratório da regra</h3><p>Exemplo com três OS do mesmo cliente</p></div>
              </div>
              <span className={"lab-result"+(qualifies?" qualifies":"")}>{qualifies?"RECORRENTE":"NÃO RECORRENTE"}</span>
            </div>
            <div className="lab-timeline">
              {["04 MAR","11 MAR","28 MAR"].map((d,i)=>(
                <div className={"lab-node"+(hits[i]?" hit":"")} key={d}>
                  <span>OS {48210+i}</span><i /><strong>{d}</strong>
                  <small>{i===0?"Sem conexão":i===1?"Lentidão":"Quedas de conexão"}</small>
                </div>
              ))}
              <div className={"lab-gap lab-gap-one"+(gaps[0]<windowDays?" hit":"")}><strong>7 dias</strong><span>{gaps[0]<windowDays?`< ${windowDays}`:`≥ ${windowDays}`}</span></div>
              <div className={"lab-gap lab-gap-two"+(gaps[1]<windowDays?" hit":"")}><strong>17 dias</strong><span>{gaps[1]<windowDays?`< ${windowDays}`:`≥ ${windowDays}`}</span></div>
            </div>
            <label className="lab-slider">
              <span>Janela de recorrência <strong>{windowDays} dias</strong></span>
              <input type="range" min="1" max={Math.max(60, windowDays)} value={windowDays} onChange={e=>onWindowChange(Number(e.target.value))} />
              <span className="slider-limits"><small>1 dia</small><small>{Math.max(60, windowDays)} dias</small></span>
            </label>
            <p className="lab-explanation">
              {qualifies ? `${hits.filter(Boolean).length} OS participam de ao menos um intervalo menor que ${windowDays} dias. O cliente atende ao mínimo de ${minOs} OS.`
                : `Apenas ${hits.filter(Boolean).length} OS ${hits.filter(Boolean).length===1?"participa":"participam"} de intervalos menores que ${windowDays} dias. Mínimo: ${minOs}.`}
            </p>
          </div>
          <div className="method-copy">
            {[
              ["01","Recorte primeiro","Somente OS cuja abertura está entre Início e Fim, inclusive, entram na comparação. Filtros de assunto e dimensões são aplicados antes de agrupar."],
              ["02","Ordene e conecte","As OS de cada IdCliente são ordenadas pela abertura. Cada intervalo é a diferença de datas corridas para a OS anterior; a hora não altera a distância."],
              ["03","Marque as participantes","Uma OS entra na regra quando possui uma anterior ou posterior a menos de N dias. O cliente é recorrente ao atingir o mínimo configurado de OS participantes."],
              ["04","Consolide sem duplicar","Quando IdOs está disponível, a primeira ocorrência é preservada e repetições entre arquivos são ignoradas. Linhas sem cliente ou data válida são ignoradas e contabilizadas."]
            ].map(([n,t,c])=>(
              <article key={n}><span>{n}</span><div><h3>{t}</h3><p>{c}</p></div></article>
            ))}
          </div>
        </div>
        <div className="method-notes">
          <details><summary>Por que uma OS pode estar destacada mesmo fora de um ciclo específico?</summary><p>O destaque indica participação em qualquer conexão válida com a OS anterior ou posterior. Ciclos agrupam sequências contíguas dessas conexões.</p></details>
          <details><summary>O que acontece com duas OS abertas no mesmo dia?</summary><p>O intervalo é zero e atende a qualquer janela maior ou igual a um dia. O painel de padrões mostra quantos pares estão nessa condição.</p></details>
          <details><summary>Como os arquivos e preferências são persistidos?</summary><p>Os registros válidos são gravados em localStorage do navegador e restaurados no próximo acesso. Tema, filtros, ordenação e presets usam o mesmo storage. “Limpar dados” remove os arquivos mantendo preferências.</p></details>
        </div>
      </div>
    </section>
  );
}

/* ---------------- MOUNT ---------------- */
const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
