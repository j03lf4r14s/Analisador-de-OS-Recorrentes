<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#070a11" />
<title>OS/Recorrência — Analisador de OS Recorrentes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script>
try {
  var saved = JSON.parse(localStorage.getItem("osAnalyzer.settings.v2") || "null");
  if (saved && (saved.theme === "light" || saved.theme === "dark")) {
    document.documentElement.dataset.theme = saved.theme;
    document.documentElement.style.colorScheme = saved.theme;
  }
} catch(_) {}
</script>
<style>
:root {
  --bg:#070a11; --bg-soft:#0a0f19; --panel:rgba(16,23,36,.78); --panel-strong:rgba(19,27,42,.96);
  --panel-solid:#111927; --input:rgba(255,255,255,.035); --ink:#edf3fb; --muted:#939eb2; --dim:#626d80;
  --line:rgba(158,176,205,.14); --line-strong:rgba(158,176,205,.25);
  --accent:#66e3d7; --accent-bright:#9affef; --accent-rgb:102,227,215;
  --violet:#9584ff; --violet-rgb:149,132,255; --pink:#ff85ac; --green:#7ee2a0;
  --danger:#ff7995; --danger-rgb:255,121,149; --warning:#f7c873; --accent-ink:#061210;
  --shadow:0 24px 70px rgba(0,0,0,.28); --soft-shadow:0 10px 32px rgba(0,0,0,.18);
  --header-bg:rgba(7,10,17,.76); --table-head:rgba(14,21,33,.96); --detail-bg:rgba(3,7,13,.34);
  --orb-one:rgba(61,210,199,.19); --orb-two:rgba(129,103,255,.19); --grid-line:rgba(139,168,194,.075);
  color-scheme:dark; font-synthesis:none;
}
:root[data-theme="light"] {
  --bg:#f1f4f7; --bg-soft:#e9eef2; --panel:rgba(255,255,255,.78); --panel-strong:rgba(255,255,255,.96);
  --panel-solid:#fff; --input:rgba(18,38,52,.035); --ink:#14202c; --muted:#5d6b7b; --dim:#8b97a5;
  --line:rgba(32,64,84,.13); --line-strong:rgba(32,64,84,.23);
  --accent:#087f79; --accent-bright:#087f79; --accent-rgb:8,127,121;
  --violet:#6952d9; --violet-rgb:105,82,217; --pink:#c94373; --green:#198d51;
  --danger:#cb3659; --danger-rgb:203,54,89; --warning:#9b6711; --accent-ink:#fff;
  --shadow:0 24px 70px rgba(43,63,82,.12); --soft-shadow:0 10px 32px rgba(43,63,82,.08);
  --header-bg:rgba(241,244,247,.82); --table-head:rgba(248,250,252,.97); --detail-bg:rgba(222,232,237,.35);
  --orb-one:rgba(61,210,199,.24); --orb-two:rgba(129,103,255,.17); --grid-line:rgba(50,88,108,.075);
  color-scheme:light;
}
*{box-sizing:border-box}
html{background:var(--bg);scroll-behavior:smooth;scroll-padding-top:88px}
body{margin:0;min-width:320px;min-height:100vh;overflow-x:hidden;background:var(--bg);color:var(--ink);
  font-family:"Manrope","Inter",system-ui,-apple-system,sans-serif;font-size:14px;line-height:1.55;
  -webkit-font-smoothing:antialiased}
button,input,select{font:inherit}
button,a,input,select,summary{-webkit-tap-highlight-color:transparent}
button{color:inherit;cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,[role="button"]:focus-visible,tr[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
::selection{background:rgba(var(--accent-rgb),.28);color:var(--ink)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line-strong);border:3px solid transparent;border-radius:20px;background-clip:padding-box}
.page-shell{width:min(1380px,calc(100% - 64px));margin-inline:auto}
.sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}
.mono,code,.section-index,.result-number,.kpi-card>strong{font-family:"JetBrains Mono",ui-monospace,monospace}
.muted-copy{color:var(--muted);font-size:12px}
.nowrap{white-space:nowrap}
.spin{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Header */
.site-header{position:fixed;inset:0 0 auto;z-index:80;height:76px;display:flex;align-items:center;gap:32px;
  padding:0 max(32px,calc((100vw - 1380px) / 2));border-bottom:1px solid var(--line);background:var(--header-bg);
  backdrop-filter:blur(22px) saturate(140%);-webkit-backdrop-filter:blur(22px) saturate(140%)}
.brand{display:inline-flex;align-items:center;gap:11px;flex-shrink:0}
.brand-mark{width:39px;height:39px;display:grid;place-items:center;border-radius:12px;color:var(--accent-ink);
  background:linear-gradient(140deg,var(--accent-bright),var(--accent));
  box-shadow:0 0 24px rgba(var(--accent-rgb),.2),inset 0 1px 0 rgba(255,255,255,.45)}
.brand-copy{display:flex;flex-direction:column;line-height:1.1}
.brand-copy strong{font-size:15px;letter-spacing:-.035em}
.brand-copy strong span{color:var(--accent);margin-inline:2px}
.brand-copy small{margin-top:5px;color:var(--muted);font-size:8px;letter-spacing:.16em;font-weight:750}
.main-nav{display:flex;align-items:center;gap:29px;margin-left:auto}
.main-nav a{position:relative;color:var(--muted);font-size:12px;font-weight:650;transition:color .2s}
.main-nav a::after{content:"";position:absolute;left:0;right:100%;bottom:-9px;height:1px;background:var(--accent);transition:right .25s}
.main-nav a:hover{color:var(--ink)}
.main-nav a:hover::after{right:0}
.header-actions{display:flex;align-items:center;gap:10px}
.header-local{display:flex;align-items:center;gap:7px;margin-right:6px;color:var(--muted);font-size:11px}
.header-local>span{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px color-mix(in srgb,var(--green) 12%,transparent)}
.theme-toggle,.mobile-menu-button{width:36px;height:36px;display:grid;place-items:center;border:1px solid var(--line);border-radius:10px;background:var(--input);transition:border-color .2s,background .2s}
.theme-toggle:hover,.mobile-menu-button:hover{border-color:var(--accent);background:rgba(var(--accent-rgb),.08)}
.theme-toggle>span{display:grid;place-items:center;transition:transform .25s}
.mobile-menu-button{display:none}

/* Buttons */
.button{min-height:39px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 15px;
  border:1px solid transparent;border-radius:11px;font-size:12px;font-weight:700;line-height:1.2;
  transition:transform .2s,box-shadow .2s,border-color .2s,background .2s,opacity .2s}
.button:hover:not(:disabled){transform:translateY(-2px)}
.button:active:not(:disabled){transform:translateY(0) scale(.98)}
.button:disabled{opacity:.42;cursor:not-allowed}
.button-primary{color:var(--accent-ink);background:linear-gradient(135deg,var(--accent-bright),var(--accent));
  box-shadow:0 8px 24px rgba(var(--accent-rgb),.15),inset 0 1px 0 rgba(255,255,255,.42)}
.button-primary:hover:not(:disabled){box-shadow:0 10px 32px rgba(var(--accent-rgb),.3)}
.button-large{min-height:50px;padding:13px 20px;border-radius:13px;font-size:13px}
.button-ghost{color:var(--ink);border-color:var(--line-strong);background:rgba(255,255,255,.035);backdrop-filter:blur(12px)}
.button-ghost:hover:not(:disabled),.button-ghost-dark:hover:not(:disabled){border-color:var(--accent);background:rgba(var(--accent-rgb),.07)}
.button-ghost-dark{color:var(--ink);border-color:var(--line);background:var(--input)}
.button-soft{color:var(--accent);border-color:rgba(var(--accent-rgb),.2);background:rgba(var(--accent-rgb),.09)}
.button-small{min-height:34px;padding:7px 11px;font-size:11px;border-radius:9px}
.button-danger{color:#fff;background:var(--danger)}
.button-header-import{color:var(--accent);border-color:rgba(var(--accent-rgb),.25);background:rgba(var(--accent-rgb),.08)}
.icon-button{width:33px;height:33px;flex:0 0 auto;display:inline-grid;place-items:center;border:1px solid var(--line);
  border-radius:9px;background:var(--input);transition:color .2s,border-color .2s,background .2s}
.icon-button:hover:not(:disabled){color:var(--accent);border-color:var(--accent)}
.icon-button:disabled{opacity:.35;cursor:not-allowed}
.icon-button.subtle{border-color:transparent;background:transparent;color:var(--muted)}
.icon-button.subtle:hover{color:var(--danger);background:rgba(var(--danger-rgb),.08)}
.text-button{display:inline-flex;align-items:center;gap:6px;padding:4px;border:0;background:transparent;font-size:11px;font-weight:650}
.text-button.danger{color:var(--danger)}

/* Hero */
.hero-scene{position:relative;height:138svh;min-height:940px}
.hero-stage{position:sticky;top:0;height:100svh;min-height:690px;overflow:hidden;background:var(--bg)}
.hero-stage::after{content:"";position:absolute;inset:auto 0 0;height:180px;background:linear-gradient(transparent,var(--bg));pointer-events:none}
.hero-grid{position:absolute;inset:-20%;background-image:linear-gradient(var(--grid-line) 1px,transparent 1px),linear-gradient(90deg,var(--grid-line) 1px,transparent 1px);background-size:56px 56px;
  mask-image:radial-gradient(ellipse 70% 65% at 64% 42%,#000 15%,transparent 76%);
  -webkit-mask-image:radial-gradient(ellipse 70% 65% at 64% 42%,#000 15%,transparent 76%);transform-origin:65% 45%}
.hero-aurora{position:absolute;border-radius:50%;filter:blur(110px);pointer-events:none}
.hero-aurora-one{width:620px;height:620px;right:-100px;top:-130px;background:var(--orb-one);animation:aurora-one 16s ease-in-out infinite alternate}
.hero-aurora-two{width:560px;height:560px;left:28%;bottom:-330px;background:var(--orb-two);animation:aurora-two 21s ease-in-out infinite alternate}
@keyframes aurora-one{to{transform:translate(-130px,110px) scale(1.16)}}
@keyframes aurora-two{to{transform:translate(170px,-90px) scale(.86)}}
.hero-noise{position:absolute;inset:0;opacity:.035;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.7'/%3E%3C/svg%3E")}
.hero-layout{position:relative;z-index:2;height:100%;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(440px,.95fr);align-items:center;gap:clamp(28px,5vw,88px);padding-top:74px;padding-bottom:62px}
.hero-copy{position:relative;z-index:3;max-width:730px}
.eyebrow{display:inline-flex;align-items:center;gap:9px;margin-bottom:25px;color:var(--accent);font-family:"JetBrains Mono",monospace;font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
.eyebrow-pulse{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 5px rgba(var(--accent-rgb),.09);animation:pulse 2.4s ease-out infinite}
@keyframes pulse{60%{box-shadow:0 0 0 9px rgba(var(--accent-rgb),0)}}
.hero-title{margin:0;font-size:clamp(52px,5.65vw,91px);line-height:.97;letter-spacing:-.065em;font-weight:600}
.title-mask{display:block;overflow:hidden;padding:0 0 .08em;margin-bottom:-.08em}
.title-mask>span{display:block;width:max-content;max-width:100%}
.hero-title-accent{color:var(--accent);font-weight:400;font-style:italic}
.hero-description{max-width:610px;margin:28px 0 0;color:var(--muted);font-size:clamp(14px,1.15vw,17px);line-height:1.72;letter-spacing:-.012em}
.hero-actions{display:flex;flex-wrap:wrap;gap:11px;margin-top:31px}
.hero-assurances{display:flex;align-items:center;flex-wrap:wrap;gap:12px;margin-top:25px;color:var(--muted);font-size:10px;font-weight:600}
.hero-assurances>span{display:inline-flex;align-items:center;gap:6px}
.hero-assurances svg{color:var(--accent)}
.assurance-divider{width:1px;height:12px;background:var(--line-strong)}
.hero-visual-wrap{position:relative;width:100%;max-width:570px;justify-self:end;transform-origin:center;perspective:1200px}
.hero-visual{position:relative;overflow:hidden;border:1px solid var(--line-strong);border-radius:25px;background:linear-gradient(145deg,rgba(var(--accent-rgb),.055),transparent 38%),var(--panel);box-shadow:0 45px 100px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.08);backdrop-filter:blur(24px)}
.visual-topbar,.visual-footer{height:47px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 18px;border-bottom:1px solid var(--line);color:var(--muted);font-family:"JetBrains Mono",monospace;font-size:8px;letter-spacing:.12em}
.visual-brand{display:flex;gap:4px}
.visual-brand span{width:5px;height:5px;border-radius:50%;background:var(--dim)}
.visual-brand span:first-child{background:var(--accent)}
.visual-live{color:var(--accent)}
.visual-canvas{position:relative;aspect-ratio:1.08;min-height:420px;overflow:hidden}
.visual-canvas::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,rgba(var(--accent-rgb),.1),transparent 44%)}
.radar-ring{position:absolute;left:50%;top:50%;translate:-50% -50%;border:1px solid var(--line);border-radius:50%}
.radar-ring-one{width:180px;height:180px;border-color:rgba(var(--accent-rgb),.2);animation:breathe 5s ease-in-out infinite}
.radar-ring-two{width:320px;height:320px;border-style:dashed;animation:spin 45s linear infinite}
.radar-ring-three{width:470px;height:470px;opacity:.65}
@keyframes breathe{50%{width:205px;height:205px;opacity:.45}}
.radar-cross{position:absolute;background:var(--line);opacity:.6}
.radar-cross.horizontal{left:5%;right:5%;top:50%;height:1px}
.radar-cross.vertical{top:5%;bottom:5%;left:50%;width:1px}
.convergence-lines{position:absolute;inset:0;width:100%;height:100%}
.convergence-lines path{stroke:rgba(var(--accent-rgb),.26);stroke-width:1;stroke-dasharray:4 7;animation:dash 18s linear infinite}
@keyframes dash{to{stroke-dashoffset:-150}}
.hero-os-card{position:absolute;z-index:3;width:225px;padding:13px 14px;border:1px solid var(--line-strong);border-radius:12px;background:var(--panel-strong);box-shadow:var(--soft-shadow);backdrop-filter:blur(16px);animation:converge .9s ease-out both}
.hero-os-card:nth-of-type(1){animation-delay:.4s}
.hero-os-card:nth-of-type(2){animation-delay:.55s}
.hero-os-card:nth-of-type(3){animation-delay:.7s}
@keyframes converge{from{opacity:0;transform:translateY(-30px) scale(.94)}to{opacity:1;transform:none}}
.hero-os-one{left:23px;top:74px}
.hero-os-two{right:18px;top:207px}
.hero-os-three{left:44px;bottom:48px}
.os-card-top{display:flex;align-items:center;justify-content:space-between;gap:7px;margin-bottom:8px;color:var(--muted);font-family:"JetBrains Mono",monospace;font-size:8px}
.os-status{color:var(--green)}
.gap-chip{padding:2px 6px;border-radius:20px;color:var(--accent);background:rgba(var(--accent-rgb),.1)}
.hero-os-card>strong{display:block;overflow:hidden;font-size:11px;text-overflow:ellipsis;white-space:nowrap}
.os-card-meta{display:block;margin-top:4px;color:var(--muted);font-size:9px}
.recurrence-result{position:absolute;z-index:5;left:50%;top:50%;translate:-50% -50%;width:205px;padding:20px;text-align:center;border:1px solid rgba(var(--accent-rgb),.45);border-radius:18px;background:var(--panel-strong);box-shadow:0 0 60px rgba(var(--accent-rgb),.15);animation:fade-in .9s ease-out .8s both}
@keyframes fade-in{from{opacity:0;transform:translate(-50%,-50%) scale(.85)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.result-kicker{color:var(--accent);font-family:"JetBrains Mono",monospace;font-size:7px;letter-spacing:.12em}
.result-number{margin:8px 0 2px;color:var(--accent);font-size:43px;line-height:1;font-weight:500;letter-spacing:-.06em}
.result-number span{font-size:15px;letter-spacing:0}
.recurrence-result>strong{font-size:11px}
.result-rule{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:13px;padding-top:11px;border-top:1px solid var(--line);color:var(--muted);font-size:8px}
.result-rule span{width:5px;height:5px;border-radius:50%;background:var(--accent)}
.visual-coordinate{position:absolute;color:var(--dim);font-family:"JetBrains Mono",monospace;font-size:7px;letter-spacing:.1em}
.coordinate-one{top:16px;right:18px}
.coordinate-two{bottom:14px;right:18px}
.visual-footer{height:42px;border-top:1px solid var(--line);border-bottom:0;font-size:7px}
.visual-footer span{display:inline-flex;align-items:center;gap:5px}
.visual-footer i{width:5px;height:5px;border-radius:50%;background:var(--accent)}
.scroll-cue{position:absolute;z-index:4;left:50%;bottom:22px;translate:-50% 0;display:flex;align-items:center;gap:12px;padding:0;border:0;background:none;color:var(--muted);font-family:"JetBrains Mono",monospace;font-size:8px;letter-spacing:.13em}
.scroll-cue-icon{width:28px;height:28px;display:grid;place-items:center;border:1px solid var(--line-strong);border-radius:50%;color:var(--accent);animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(5px)}}

/* Workspace and panels */
.workspace{position:relative;padding-top:85px;padding-bottom:125px;scroll-margin-top:58px}
.workspace::before{content:"";position:absolute;z-index:-1;width:700px;height:700px;right:-350px;top:280px;border-radius:50%;background:var(--orb-two);filter:blur(150px);opacity:.45;pointer-events:none}
.workspace-intro{display:grid;grid-template-columns:1.2fr .8fr;align-items:end;gap:60px;margin-bottom:38px}
.workspace-kicker{display:inline-flex;align-items:center;gap:8px;margin-bottom:14px;color:var(--accent);font-family:"JetBrains Mono",monospace;font-size:9px;letter-spacing:.14em}
.workspace-intro h2{max-width:700px;margin:0;font-size:clamp(31px,3.4vw,50px);line-height:1.08;letter-spacing:-.05em;font-weight:560}
.workspace-intro>p{margin:0 0 4px;color:var(--muted);font-size:13px;line-height:1.75}
.panel{position:relative;border:1px solid var(--line);border-radius:20px;background:var(--panel);box-shadow:var(--soft-shadow),inset 0 1px 0 rgba(255,255,255,.035);backdrop-filter:blur(24px) saturate(130%);-webkit-backdrop-filter:blur(24px) saturate(130%)}
.panel-heading{display:flex;align-items:center;justify-content:space-between;gap:20px}
.panel-heading h2,.results-section-heading h2{display:flex;align-items:center;gap:9px;margin:5px 0 0;font-size:18px;line-height:1.3;letter-spacing:-.025em;font-weight:650}
.section-index{display:block;color:var(--muted);font-size:8px;font-weight:550;letter-spacing:.14em}
.local-badge{display:inline-flex;align-items:center;gap:7px;padding:6px 10px;border:1px solid var(--line);border-radius:30px;color:var(--muted);background:var(--input);font-size:9px;font-weight:650}
.local-badge svg{color:var(--accent)}

/* Upload */
.upload-panel{padding:23px;margin-bottom:18px}
.upload-heading{margin-bottom:18px}
.drop-zone{position:relative;min-height:140px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;padding:25px;overflow:hidden;text-align:center;border:1px dashed rgba(var(--accent-rgb),.38);border-radius:15px;background:rgba(var(--accent-rgb),.035);transition:border-color .25s,background .25s,transform .25s,box-shadow .25s;cursor:pointer}
.drop-zone::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 120%,rgba(var(--accent-rgb),.11),transparent 55%);opacity:0;transition:opacity .25s}
.drop-zone:hover,.drop-zone.is-dragging{border-color:var(--accent);background:rgba(var(--accent-rgb),.065);box-shadow:inset 0 0 35px rgba(var(--accent-rgb),.05);transform:translateY(-1px)}
.drop-zone:hover::before,.drop-zone.is-dragging::before{opacity:1}
.drop-zone.is-compact{min-height:76px;flex-direction:row;justify-content:flex-start;padding:15px 18px;text-align:left}
.drop-icon{position:relative;width:50px;height:50px;display:grid;place-items:center;border:1px solid rgba(var(--accent-rgb),.22);border-radius:14px;color:var(--accent);background:rgba(var(--accent-rgb),.08)}
.is-compact .drop-icon{width:40px;height:40px;flex:0 0 auto;border-radius:11px}
.drop-copy{position:relative;display:flex;flex-direction:column;gap:3px}
.drop-copy strong{font-size:13px;font-weight:650}
.drop-copy span{color:var(--muted);font-size:11px}
.drop-action{position:relative;display:inline-flex;align-items:center;gap:7px;margin-top:5px;color:var(--accent);font-size:10px;font-weight:700}
.loading-veil{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;gap:10px;color:var(--accent);background:var(--panel-strong);backdrop-filter:blur(10px);font-size:12px;font-weight:650}
.error-stack{overflow:hidden}
.error-message{display:flex;align-items:flex-start;gap:8px;margin-top:10px;padding:10px 12px;border:1px solid rgba(var(--danger-rgb),.22);border-radius:10px;color:var(--danger);background:rgba(var(--danger-rgb),.06);font-size:11px}
.error-message svg{flex:0 0 auto;margin-top:1px}
.file-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:13px}
.file-item{min-width:0;display:flex;align-items:center;gap:10px;padding:10px 10px 10px 12px;border:1px solid var(--line);border-radius:11px;background:var(--input);animation:slide-in .25s ease-out}
@keyframes slide-in{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}
.file-type-icon{width:34px;height:34px;flex:0 0 auto;display:grid;place-items:center;border-radius:9px;color:var(--accent);background:rgba(var(--accent-rgb),.08)}
.file-info{min-width:0;flex:1;display:flex;flex-direction:column}
.file-info strong{overflow:hidden;font-size:11px;font-weight:650;text-overflow:ellipsis;white-space:nowrap}
.file-info span{color:var(--muted);font-size:9px}
.demo-tag{flex:0 0 auto;padding:3px 6px;border:1px solid rgba(var(--violet-rgb),.25);border-radius:5px;color:var(--violet);font-family:"JetBrains Mono",monospace;font-size:7px;letter-spacing:.08em}
.upload-summary{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:12px}
.quality-notes{display:flex;flex-wrap:wrap;gap:8px 16px}
.quality-notes span{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:9px}
.quality-notes svg{color:var(--accent)}
.upload-empty-footer{display:flex;align-items:center;justify-content:space-between;gap:25px;padding:18px 3px 0}
.empty-footer-label{font-size:11px;font-weight:650}
.upload-empty-footer p{margin:3px 0 0;color:var(--muted);font-size:10px}
.empty-footer-actions{display:flex;flex:0 0 auto;gap:8px}
.demo-disclaimer{margin:10px 0 0;color:var(--muted);font-size:9px}

/* Filters */
.filters-panel{padding:23px;margin-bottom:38px}
.filters-heading{margin-bottom:21px}
.filter-header-actions{display:flex;align-items:center;gap:8px}
.preset-control{height:34px;display:flex;align-items:center;gap:6px;padding-left:10px;border:1px solid var(--line);border-radius:9px;color:var(--muted);background:var(--input)}
.preset-control select{width:135px;height:30px;padding:0 5px;border:0;background:transparent;color:var(--muted);font-size:10px}
.preset-control .icon-button{width:27px;height:27px}
.filters-grid{display:grid;grid-template-columns:1.05fr 1fr 1fr .8fr .9fr 1fr;gap:12px}
.field-label{min-width:0;display:flex;flex-direction:column;gap:6px;color:var(--muted);font-size:8px;font-weight:750;letter-spacing:.095em;text-transform:uppercase}
.field-label input,.field-label select,.input-with-icon,.advanced-filters select{width:100%;min-width:0;height:40px;padding:0 11px;border:1px solid var(--line);border-radius:10px;outline:none;color:var(--ink);background:var(--input);font-size:11px;font-weight:520;letter-spacing:0;text-transform:none;transition:border-color .2s,box-shadow .2s,background .2s}
.field-label input:hover,.field-label select:hover,.input-with-icon:hover{border-color:var(--line-strong)}
.field-label input:focus,.field-label select:focus,.input-with-icon:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(var(--accent-rgb),.08)}
select option{color:var(--ink);background:var(--panel-solid)}
.search-field{grid-column:span 2}
.input-with-icon{display:flex;align-items:center;gap:7px;padding-right:7px;color:var(--muted)}
.input-with-icon input{flex:1;min-width:0;height:36px;padding:0;border:0;outline:0;color:var(--ink);background:transparent;box-shadow:none}
.input-with-icon input:focus{box-shadow:none}
.input-with-icon button{display:grid;place-items:center;padding:4px;border:0;color:var(--muted);background:transparent}
.window-shortcuts{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-top:14px}
.window-shortcuts>span{margin-right:4px;color:var(--muted);font-size:9px}
.window-shortcuts button{padding:4px 9px;border:1px solid var(--line);border-radius:20px;color:var(--muted);background:transparent;font-size:9px;transition:.2s}
.window-shortcuts button:hover,.window-shortcuts button.active{color:var(--accent);border-color:rgba(var(--accent-rgb),.35);background:rgba(var(--accent-rgb),.08)}
.advanced-toggle{display:flex;align-items:center;gap:7px;margin-top:15px;padding:5px 0;border:0;color:var(--muted);background:transparent;font-size:10px;font-weight:650}
.advanced-toggle>svg:last-child{transition:transform .2s}
.advanced-toggle>svg.rotated{transform:rotate(180deg)}
.active-filter-count{min-width:17px;height:17px;display:grid;place-items:center;border-radius:20px;color:var(--accent-ink);background:var(--accent);font-size:8px}
.advanced-filters{overflow:hidden}
.advanced-filters-inner{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding-top:12px}
.active-filter-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.active-filter-chips button{display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border:1px solid rgba(var(--accent-rgb),.2);border-radius:20px;color:var(--muted);background:rgba(var(--accent-rgb),.06);font-size:9px}
.active-filter-chips strong{color:var(--accent);font-weight:650}
.subject-filter{margin-top:16px;padding-top:15px;border-top:1px solid var(--line)}
.subject-filter summary{display:flex;align-items:center;justify-content:space-between;cursor:pointer;list-style:none;color:var(--ink);font-size:11px;font-weight:650}
.subject-filter summary::-webkit-details-marker{display:none}
.subject-filter summary strong{margin-left:6px;color:var(--accent);font-family:"JetBrains Mono",monospace;font-size:9px;font-weight:500}
.subject-filter summary>svg{color:var(--muted);transition:transform .2s}
.subject-filter[open] summary>svg{transform:rotate(180deg)}
.subject-actions{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-top:12px}
.subject-actions>button{padding:5px 9px;border:1px solid var(--line);border-radius:7px;color:var(--muted);background:var(--input);font-size:9px}
.subject-actions>button:hover{color:var(--accent);border-color:var(--accent)}
.subject-search{height:28px;display:flex;align-items:center;gap:5px;margin-left:auto;padding:0 8px;border:1px solid var(--line);border-radius:7px;color:var(--muted);background:var(--input)}
.subject-search input{width:130px;border:0;outline:0;color:var(--ink);background:transparent;font-size:9px}
.subject-chips{display:flex;flex-wrap:wrap;gap:7px;max-height:190px;margin-top:11px;padding:1px;overflow-y:auto}
.subject-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 9px;border:1px solid var(--line);border-radius:9px;color:var(--muted);background:var(--input);font-size:9px;cursor:pointer;user-select:none;transition:border-color .2s,background .2s,color .2s}
.subject-chip:hover{border-color:var(--line-strong);color:var(--ink)}
.subject-chip.selected{color:var(--ink);border-color:rgba(var(--accent-rgb),.35);background:rgba(var(--accent-rgb),.075)}
.subject-chip input{position:absolute;opacity:0;pointer-events:none}
.chip-check{width:13px;height:13px;display:grid;place-items:center;border:1px solid var(--line-strong);border-radius:4px;color:var(--accent-ink);font-size:9px;line-height:1}
.selected .chip-check{border-color:var(--accent);background:var(--accent)}
.subject-chip small{min-width:18px;padding:1px 4px;border-radius:5px;color:var(--muted);background:var(--input);font-family:"JetBrains Mono",monospace;font-size:8px;text-align:center}
.inline-warning{margin:10px 0 0;color:var(--warning);font-size:10px}
.rule-callout{display:flex;align-items:flex-start;gap:12px;margin-top:17px;padding:12px 14px;border:1px solid var(--line);border-radius:11px;background:var(--input)}
.rule-symbol{width:25px;height:25px;flex:0 0 auto;display:grid;place-items:center;border-radius:7px;color:var(--accent);background:rgba(var(--accent-rgb),.09);font-family:"JetBrains Mono",monospace;font-weight:600}
.rule-callout p{margin:1px 0 0;color:var(--muted);font-size:10px;line-height:1.65}
.rule-callout strong{color:var(--ink);font-weight:650}

/* Empty workspace */
.empty-workspace-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:18px}
.empty-guide,.schema-card{padding:28px}
.empty-guide h3,.schema-card h3{margin:10px 0 20px;font-size:23px;line-height:1.25;letter-spacing:-.035em}
.guide-steps{display:grid;gap:0}
.guide-steps>div{display:flex;gap:13px;padding:13px 0;border-top:1px solid var(--line)}
.guide-steps>div>span{color:var(--accent);font-family:"JetBrains Mono",monospace;font-size:9px}
.guide-steps p{margin:0;color:var(--muted);font-size:11px}
.guide-steps strong{color:var(--ink)}
.empty-guide-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.schema-card>p{margin:-10px 0 18px;color:var(--muted);font-size:10px}
.schema-list>div{display:grid;grid-template-columns:1fr auto;gap:1px 10px;padding:10px 0;border-top:1px solid var(--line)}
.schema-list code{color:var(--accent);font-size:10px}
.schema-list>div>span{color:var(--muted);font-size:8px;text-transform:uppercase}
.schema-list p{grid-column:1/-1;margin:2px 0 0;color:var(--muted);font-size:9px}

/* KPI */
.kpi-section,.insights-section{margin-bottom:38px}
.results-section-heading{display:flex;align-items:flex-end;justify-content:space-between;gap:25px;margin-bottom:16px}
.results-section-heading>span{color:var(--muted);font-size:9px}
.kpi-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.kpi-card{position:relative;min-width:0;min-height:178px;display:flex;flex-direction:column;align-items:flex-start;padding:16px;overflow:hidden;text-align:left;border:1px solid var(--line);border-radius:16px;color:var(--ink);background:var(--panel);box-shadow:var(--soft-shadow);backdrop-filter:blur(20px);transition:transform .2s,border-color .2s,background .2s}
.kpi-card::after{content:"";position:absolute;inset:auto 0 0;height:2px;background:var(--tone);opacity:0;transition:opacity .2s}
.kpi-card:hover{transform:translateY(-4px)}
.kpi-card:hover,.kpi-card.active{border-color:color-mix(in srgb,var(--tone) 45%,var(--line));background:linear-gradient(150deg,color-mix(in srgb,var(--tone) 7%,transparent),transparent 55%),var(--panel)}
.kpi-card.active::after{opacity:1}
.tone-cyan{--tone:var(--accent)}
.tone-violet{--tone:var(--violet)}
.tone-blue{--tone:#68b9ff}
.tone-pink{--tone:var(--pink)}
.tone-green{--tone:var(--green)}
.kpi-topline{width:100%;display:flex;align-items:center;justify-content:space-between;color:var(--tone)}
.kpi-topline>span{color:var(--dim);font-family:"JetBrains Mono",monospace;font-size:8px}
.kpi-card>strong{display:block;margin-top:20px;font-size:clamp(27px,2.4vw,38px);line-height:1;font-weight:520;letter-spacing:-.06em}
.kpi-label{margin-top:9px;font-size:10px;font-weight:650}
.kpi-detail{margin-top:auto;padding-top:9px;color:var(--muted);font-size:8px;line-height:1.4}

/* Insights */
.insights-layout{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px}
.insight-card{min-width:0;padding:20px}
.timeline-panel{grid-column:span 8}
.ranking-panel{grid-column:span 4}
.gap-panel{grid-column:span 7}
.pattern-panel{grid-column:span 5}
.insight-card-header{display:flex;align-items:flex-start;justify-content:space-between;gap:15px;margin-bottom:18px}
.insight-card-header>div:first-child{display:flex;align-items:center;gap:10px}
.insight-icon{width:33px;height:33px;flex:0 0 auto;display:grid;place-items:center;border-radius:9px;color:var(--accent);background:rgba(var(--accent-rgb),.09)}
.insight-icon.violet{color:var(--violet);background:rgba(var(--violet-rgb),.09)}
.insight-icon.green{color:var(--green);background:color-mix(in srgb,var(--green) 9%,transparent)}
.insight-icon.pink{color:var(--pink);background:color-mix(in srgb,var(--pink) 9%,transparent)}
.insight-card h3{margin:0;font-size:12px;font-weight:680}
.insight-card-header p{margin:2px 0 0;color:var(--muted);font-size:8px}
.chart-legend{display:flex;gap:10px;color:var(--muted);font-size:8px}
.chart-legend span{display:flex;align-items:center;gap:5px}
.chart-legend i{width:7px;height:7px;border-radius:2px}
.legend-clients{background:rgba(var(--accent-rgb),.35)}
.legend-os{background:var(--accent)}
.timeline-scroll{overflow-x:auto}
.timeline-chart{position:relative;height:205px;display:flex;align-items:stretch;gap:7px;padding-top:8px;border-bottom:1px solid var(--line)}
.chart-gridlines{position:absolute;inset:8px 0 29px;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none}
.chart-gridlines span{display:block;border-top:1px dashed var(--line)}
.timeline-column{position:relative;z-index:1;flex:1;min-width:42px;display:flex;flex-direction:column;align-items:center;padding:0 3px;border:0;color:var(--muted);background:transparent}
.bars-wrap{height:145px;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:3px}
.bars-wrap i{display:block;width:min(15px,34%);min-height:1px;border-radius:4px 4px 1px 1px;transition:height .45s ease-out}
.bar-clients{background:rgba(var(--accent-rgb),.25)}
.bar-os{background:linear-gradient(to top,rgba(var(--accent-rgb),.4),var(--accent));box-shadow:0 0 14px rgba(var(--accent-rgb),.08)}
.timeline-column.selected .bar-clients{background:rgba(var(--accent-rgb),.48)}
.timeline-column.selected .bar-os{box-shadow:0 0 18px rgba(var(--accent-rgb),.25)}
.timeline-value{height:18px;color:var(--accent);font-family:"JetBrains Mono",monospace;font-size:8px}
.timeline-label{height:29px;display:flex;align-items:flex-end;padding-bottom:7px;font-size:8px;text-transform:capitalize;white-space:nowrap}
.chart-readout{display:flex;align-items:center;flex-wrap:wrap;gap:7px 17px;padding-top:12px;color:var(--muted);font-size:8px}
.chart-readout strong{margin-right:auto;color:var(--ink);font-size:10px;text-transform:capitalize}
.dimension-tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;margin-bottom:12px;padding:3px;border:1px solid var(--line);border-radius:9px;background:var(--input)}
.dimension-tabs button{padding:5px 3px;border:0;border-radius:6px;color:var(--muted);background:transparent;font-size:8px}
.dimension-tabs button.active{color:var(--accent);background:rgba(var(--accent-rgb),.1)}
.ranking-list{min-height:219px}
.ranking-row{width:100%;display:flex;align-items:center;gap:9px;padding:8px 1px;border:0;border-bottom:1px solid var(--line);text-align:left;color:var(--muted);background:transparent}
.ranking-row:hover{color:var(--accent)}
.ranking-position{color:var(--dim);font-family:"JetBrains Mono",monospace;font-size:8px}
.ranking-content{min-width:0;flex:1}
.ranking-label{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ranking-label strong{overflow:hidden;color:var(--ink);font-size:9px;font-weight:600;text-overflow:ellipsis;white-space:nowrap}
.ranking-label small{flex:0 0 auto;color:var(--muted);font-size:7px}
.ranking-track{height:2px;display:block;margin-top:6px;overflow:hidden;border-radius:2px;background:var(--line)}
.ranking-track i{display:block;height:100%;border-radius:inherit;background:var(--violet);transition:width .45s ease-out}
.chart-total{color:var(--accent);font-family:"JetBrains Mono",monospace;font-size:9px}
.gap-chart{display:grid;gap:11px;padding:5px 0}
.gap-row{display:grid;grid-template-columns:65px 1fr 30px;align-items:center;gap:11px}
.gap-label{color:var(--ink);font-family:"JetBrains Mono",monospace;font-size:9px}
.gap-label small{color:var(--muted);font-size:7px}
.gap-track{height:8px;overflow:hidden;border-radius:3px;background:var(--input)}
.gap-track i{display:block;height:100%;min-width:1px;border-radius:inherit;background:linear-gradient(90deg,rgba(var(--accent-rgb),.35),var(--accent));transition:width .5s ease-out}
.gap-row>strong{color:var(--muted);font-family:"JetBrains Mono",monospace;font-size:9px;text-align:right}
.gap-axis{display:flex;justify-content:space-between;margin:13px 40px 0 76px;color:var(--dim);font-size:7px}
.pattern-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.pattern-stats>div{padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--input)}
.pattern-stats span{display:block;color:var(--muted);font-size:8px}
.pattern-stats strong{display:block;margin-top:5px;font-family:"JetBrains Mono",monospace;font-size:15px;font-weight:500}
.pattern-note{display:flex;align-items:flex-start;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);color:var(--muted)}
.pattern-note svg{flex:0 0 auto;margin-top:2px;color:var(--pink)}
.pattern-note p{margin:0;font-size:9px;line-height:1.65}
.empty-chart{min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--dim);font-size:10px}
.empty-chart.compact{min-height:190px}

/* Results */
.results-panel{overflow:hidden}
.results-header{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:22px 23px;border-bottom:1px solid var(--line)}
.results-header h2{margin:6px 0 0;font-size:17px;letter-spacing:-.025em}
.results-header p{margin:4px 0 0;color:var(--muted);font-size:9px}
.results-actions{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:7px}
.table-scroll,.inner-table-scroll{width:100%;overflow-x:auto}
.data-table{width:100%;border-collapse:collapse;text-align:left}
.data-table th{height:40px;padding:0 13px;border-bottom:1px solid var(--line);color:var(--muted);background:var(--table-head);font-size:8px;font-weight:700;letter-spacing:.065em;text-transform:uppercase;white-space:nowrap}
.grouped-table>thead>tr>th{position:sticky;top:0;z-index:2}
.data-table th>button{display:inline-flex;align-items:center;gap:5px;padding:5px 0;border:0;color:inherit;background:transparent;font:inherit;letter-spacing:inherit;text-transform:inherit}
.data-table th>button svg{opacity:.45}
.data-table th>button.sorted{color:var(--accent)}
.data-table th>button.sorted svg{opacity:1}
.data-table th.numeric,.data-table td.numeric{text-align:right}
.data-table th.numeric>button{justify-content:flex-end;width:100%}
.data-table td{padding:12px 13px;border-bottom:1px solid var(--line);color:var(--muted);font-size:10px;vertical-align:top}
.main-row{cursor:pointer;transition:background .18s}
.main-row:hover td,.main-row.open td{background:rgba(var(--accent-rgb),.035)}
.main-row.open td{border-bottom-color:transparent}
.main-row td:first-child,.main-row th:first-child{padding-left:18px}
.expand-column{width:34px;padding-right:0!important}
.expand-button{display:grid;place-items:center;padding:3px;border:0;color:var(--accent);background:transparent}
.expand-button svg{transition:transform .2s}
.main-row.open .expand-button svg{transform:rotate(90deg)}
.client-name{display:block;max-width:230px;color:var(--ink);font-size:10px;font-weight:680}
.cell-subtitle{display:block;margin-top:2px;color:var(--dim);font-family:"JetBrains Mono",monospace;font-size:8px}
.count-pill{display:inline-block;min-width:25px;padding:2px 7px;border:1px solid rgba(var(--accent-rgb),.3);border-radius:20px;color:var(--accent);background:rgba(var(--accent-rgb),.09);font-family:"JetBrains Mono",monospace;font-size:9px;font-weight:650;text-align:center}
.detail-row>td{padding:0!important;background:var(--detail-bg)}
.detail-animation{padding:0 22px 18px 47px;overflow:hidden;animation:detail-open .28s ease-out both;transform-origin:top}
@keyframes detail-open{from{opacity:0;transform:translateY(-8px) scaleY(.96)}to{opacity:1;transform:none}}
.episode-strip{display:flex;align-items:stretch;flex-wrap:wrap;gap:7px;padding:14px 0}
.episode-strip-title{display:flex;align-items:center;margin-right:4px;color:var(--muted);font-size:8px;font-weight:700;letter-spacing:.07em;text-transform:uppercase}
.episode-chip{display:grid;grid-template-columns:auto auto;gap:1px 9px;padding:7px 10px;border:1px solid rgba(var(--accent-rgb),.18);border-radius:8px;background:rgba(var(--accent-rgb),.045)}
.episode-chip strong{color:var(--accent);font-size:8px}
.episode-chip span{color:var(--ink);font-size:8px}
.episode-chip small{grid-column:1/-1;color:var(--muted);font-size:7px}
.inner-table{min-width:1150px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.inner-table th{position:static;height:34px;background:var(--input);font-size:7px}
.inner-table td{padding:9px 11px;font-size:9px}
.detail-note{margin:10px 0 0;color:var(--dim);font-size:8px}
.os-hit td{background:rgba(var(--accent-rgb),.025)}
.os-dim td{color:var(--dim)}
.os-hit .client-name,.os-hit .mono-cell{color:var(--ink)}
.gap-value{color:var(--accent);font-family:"JetBrains Mono",monospace;font-weight:650;white-space:nowrap}
.diagnostic-cell{min-width:230px;max-width:340px}
.origin-cell{max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.status-tag{display:inline-block;padding:2px 6px;border:1px solid var(--line);border-radius:5px;font-size:8px;white-space:nowrap}
.status-tag.closed{color:var(--green);border-color:color-mix(in srgb,var(--green) 25%,transparent);background:color-mix(in srgb,var(--green) 6%,transparent)}
.flat-table{min-width:1450px}
.grouped-table{min-width:1050px}
.empty-results{min-height:250px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;color:var(--muted);text-align:center}
.empty-results>svg{color:var(--dim)}
.empty-results strong{color:var(--ink);font-size:13px}
.empty-results p{max-width:480px;margin:0 0 5px;font-size:10px}
.table-footer{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:13px 20px;border-top:1px solid var(--line)}
.table-legend{display:flex;align-items:center;flex-wrap:wrap;gap:8px 15px;color:var(--dim);font-size:8px}
.table-legend span{display:inline-flex;align-items:center;gap:5px}
.table-legend i{width:7px;height:7px;border-radius:2px}
.legend-hit{background:var(--accent)}
.legend-out{background:var(--dim)}
.pagination{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:8px;white-space:nowrap}
.pagination label{display:flex;align-items:center;gap:6px;margin-right:8px}
.pagination select{height:28px;padding:0 5px;border:1px solid var(--line);border-radius:7px;color:var(--ink);background:var(--input);font-size:9px}
.pagination .icon-button{width:28px;height:28px}
.page-number{font-family:"JetBrains Mono",monospace}

/* Methodology */
.methodology-section{position:relative;padding:115px 0 105px;overflow:hidden;border-top:1px solid var(--line);background:var(--bg-soft)}
.methodology-section::before{content:"";position:absolute;width:600px;height:600px;left:-300px;top:10%;border-radius:50%;background:var(--orb-one);filter:blur(140px)}
.method-heading{position:relative;display:grid;grid-template-columns:1.15fr .85fr;align-items:end;gap:70px;margin-bottom:45px}
.method-heading h2{margin:12px 0 0;font-size:clamp(35px,4.3vw,61px);line-height:1.04;letter-spacing:-.055em;font-weight:560}
.method-heading h2 em{color:var(--accent);font-weight:430}
.method-heading>p{margin:0 0 4px;color:var(--muted);font-size:12px;line-height:1.8}
.method-grid{position:relative;display:grid;grid-template-columns:1.07fr .93fr;gap:50px;align-items:center}
.rule-lab{padding:24px;overflow:hidden}
.rule-lab-header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.rule-lab-header>div{display:flex;align-items:center;gap:10px}
.rule-lab-header h3{margin:0;font-size:13px}
.rule-lab-header p{margin:2px 0 0;color:var(--muted);font-size:9px}
.lab-result{padding:4px 7px;border:1px solid var(--line);border-radius:6px;color:var(--muted);font-family:"JetBrains Mono",monospace;font-size:7px;letter-spacing:.08em}
.lab-result.qualifies{color:var(--accent);border-color:rgba(var(--accent-rgb),.3);background:rgba(var(--accent-rgb),.06)}
.lab-timeline{position:relative;height:225px;display:grid;grid-template-columns:repeat(3,1fr);align-items:center;margin:15px 0 5px}
.lab-timeline::before{content:"";position:absolute;left:15%;right:15%;top:103px;height:1px;background:var(--line-strong)}
.lab-node{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;text-align:center}
.lab-node>span{color:var(--muted);font-family:"JetBrains Mono",monospace;font-size:8px}
.lab-node>i{width:17px;height:17px;margin:21px 0 18px;border:4px solid var(--panel-solid);border-radius:50%;background:var(--dim);box-shadow:0 0 0 1px var(--line-strong);transition:background .25s,box-shadow .25s,transform .25s}
.lab-node.hit>i{background:var(--accent);box-shadow:0 0 0 1px var(--accent),0 0 22px rgba(var(--accent-rgb),.28);transform:scale(1.12)}
.lab-node>strong{font-family:"JetBrains Mono",monospace;font-size:10px;font-weight:500}
.lab-node>small{max-width:110px;margin-top:4px;color:var(--muted);font-size:8px}
.lab-gap{position:absolute;z-index:3;top:64px;display:flex;align-items:center;gap:5px;padding:4px 7px;border:1px solid var(--line);border-radius:6px;background:var(--panel-solid);color:var(--muted);font-family:"JetBrains Mono",monospace;font-size:8px}
.lab-gap.hit{color:var(--accent);border-color:rgba(var(--accent-rgb),.25)}
.lab-gap-one{left:26%}
.lab-gap-two{left:61%}
.lab-gap span{color:var(--dim);font-size:7px}
.lab-slider{display:block;padding:13px 14px;border:1px solid var(--line);border-radius:11px;background:var(--input)}
.lab-slider>span:first-child{display:flex;justify-content:space-between;color:var(--muted);font-size:9px}
.lab-slider>span strong{color:var(--accent);font-family:"JetBrains Mono",monospace}
.lab-slider input{width:100%;height:4px;margin:16px 0 5px;accent-color:var(--accent)}
.slider-limits{display:flex;justify-content:space-between;color:var(--dim)}
.lab-explanation{margin:12px 1px 0;color:var(--muted);font-size:9px;line-height:1.6}
.method-copy{display:grid}
.method-copy article{display:flex;gap:18px;padding:19px 0;border-top:1px solid var(--line)}
.method-copy article>span{padding-top:3px;color:var(--accent);font-family:"JetBrains Mono",monospace;font-size:9px}
.method-copy h3{margin:0 0 5px;font-size:13px;font-weight:650}
.method-copy p{margin:0;color:var(--muted);font-size:10px;line-height:1.7}
.method-notes{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:55px}
.method-notes details{padding:16px 18px;border:1px solid var(--line);border-radius:13px;background:var(--input)}
.method-notes summary{color:var(--ink);font-size:10px;font-weight:650;line-height:1.5;cursor:pointer}
.method-notes p{margin:12px 0 0;color:var(--muted);font-size:9px;line-height:1.75}

/* Footer */
.site-footer{padding:55px 0 20px;border-top:1px solid var(--line);background:var(--bg)}
.footer-grid{display:grid;grid-template-columns:.85fr 1.35fr .8fr;gap:55px;align-items:start}
.footer-brand{display:flex;gap:12px}
.footer-brand strong{font-size:14px}
.footer-brand p,.footer-privacy p{margin:6px 0 0;color:var(--muted);font-size:9px;line-height:1.7}
.footer-privacy{display:flex;gap:13px}
.footer-privacy>svg{flex:0 0 auto;color:var(--accent)}
.footer-privacy strong{font-size:11px}
.footer-meta{display:flex;flex-direction:column;gap:7px;color:var(--muted);font-family:"JetBrains Mono",monospace;font-size:8px}
.footer-bottom{display:flex;justify-content:space-between;margin-top:40px;padding-top:17px;border-top:1px solid var(--line);color:var(--dim);font-size:8px}

/* Toasts and modals */
.toast-region{position:fixed;z-index:120;right:20px;bottom:20px;width:min(390px,calc(100vw - 32px));display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{display:flex;align-items:flex-start;gap:9px;padding:13px 12px 13px 14px;border:1px solid var(--line-strong);border-radius:12px;color:var(--ink);background:var(--panel-strong);box-shadow:var(--shadow);backdrop-filter:blur(20px);font-size:10px;pointer-events:auto;animation:toast-in .3s ease-out}
@keyframes toast-in{from{opacity:0;transform:translateY(18px) scale(.96)}to{opacity:1;transform:none}}
.toast>svg{flex:0 0 auto;margin-top:1px;color:var(--accent)}
.toast-error>svg{color:var(--danger)}
.toast-info>svg{color:var(--violet)}
.toast>span{flex:1}
.toast>button{display:grid;place-items:center;padding:1px;border:0;color:var(--muted);background:transparent}
.modal-backdrop{position:fixed;inset:0;z-index:110;display:grid;place-items:center;padding:20px;background:rgba(2,5,10,.7);backdrop-filter:blur(9px);animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal-card{position:relative;width:min(450px,100%);padding:27px;border:1px solid var(--line-strong);border-radius:20px;background:var(--panel-solid);box-shadow:var(--shadow);animation:modal-in .22s ease-out}
@keyframes modal-in{from{opacity:0;transform:translateY(24px) scale(.96)}to{opacity:1;transform:none}}
.modal-close{position:absolute;top:14px;right:14px}
.modal-icon{width:42px;height:42px;display:grid;place-items:center;margin-bottom:16px;border-radius:12px;color:var(--accent);background:rgba(var(--accent-rgb),.1)}
.modal-icon.danger{color:var(--danger);background:rgba(var(--danger-rgb),.09)}
.modal-card h2{margin:0;font-size:20px;letter-spacing:-.035em}
.modal-card p{margin:10px 0 20px;color:var(--muted);font-size:11px;line-height:1.7}
.modal-card .field-label input{margin-top:2px;height:44px;font-size:12px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:22px}

/* Responsive */
@media (max-width:1220px){
  .site-header{padding-inline:28px}
  .main-nav{gap:20px}
  .hero-layout{grid-template-columns:minmax(0,1.05fr) minmax(390px,.85fr);gap:25px}
  .hero-title{font-size:clamp(50px,5.8vw,72px)}
  .hero-visual-wrap{max-width:490px}
  .visual-canvas{min-height:390px}
  .hero-os-card{width:200px}
  .filters-grid{grid-template-columns:repeat(4,1fr)}
  .search-field{grid-column:span 2}
  .kpi-grid{grid-template-columns:repeat(3,1fr)}
  .kpi-card{min-height:155px}
  .kpi-card>strong{margin-top:14px}
  .timeline-panel{grid-column:span 7}
  .ranking-panel{grid-column:span 5}
}
@media (max-width:980px){
  .page-shell{width:min(100% - 40px,1380px)}
  .header-local{display:none}
  .main-nav{margin-left:auto}
  .hero-layout{display:flex;align-items:center}
  .hero-copy{max-width:670px}
  .hero-title{font-size:clamp(54px,8.3vw,77px)}
  .hero-visual-wrap{position:absolute;z-index:-1;right:-210px;top:50%;width:530px;opacity:.28;translate:0 -50%}
  .hero-description{max-width:540px}
  .workspace-intro{gap:35px}
  .file-list{grid-template-columns:1fr}
  .upload-empty-footer{align-items:flex-start;flex-direction:column}
  .filters-heading{align-items:flex-start}
  .filter-header-actions{flex-wrap:wrap;justify-content:flex-end}
  .insights-layout{grid-template-columns:repeat(2,minmax(0,1fr))}
  .timeline-panel,.ranking-panel,.gap-panel,.pattern-panel{grid-column:span 1}
  .timeline-panel{grid-column:1/-1}
  .empty-workspace-grid{grid-template-columns:1fr}
  .method-grid{grid-template-columns:1fr;gap:35px}
  .method-copy{grid-template-columns:repeat(2,1fr);gap:0 25px}
  .method-notes{grid-template-columns:1fr}
  .footer-grid{grid-template-columns:1fr 1.4fr}
  .footer-meta{grid-column:1/-1;flex-direction:row;flex-wrap:wrap;gap:20px}
  .table-footer{align-items:flex-start;flex-direction:column}
  .pagination{width:100%;justify-content:flex-end}
}
@media (max-width:720px){
  html{scroll-padding-top:72px}
  .page-shell{width:calc(100% - 26px)}
  .site-header{height:66px;gap:12px;padding-inline:14px}
  .brand-copy small{display:none}
  .brand-mark{width:35px;height:35px}
  .main-nav{position:absolute;top:66px;left:0;right:0;display:none;flex-direction:column;align-items:stretch;gap:0;padding:8px 14px 14px;border-bottom:1px solid var(--line);background:var(--header-bg);backdrop-filter:blur(22px)}
  .main-nav.mobile-open{display:flex}
  .main-nav a{padding:12px;border-bottom:1px solid var(--line)}
  .main-nav a::after{display:none}
  .header-actions{margin-left:auto}
  .mobile-menu-button{display:grid}
  .button-header-import{width:35px;min-height:35px;padding:0;font-size:0}
  .hero-scene{height:125svh;min-height:900px}
  .hero-stage{min-height:690px}
  .hero-layout{padding-top:82px;padding-bottom:70px}
  .hero-title{font-size:clamp(44px,12.2vw,69px);line-height:1}
  .eyebrow{max-width:300px;margin-bottom:19px;font-size:8px}
  .hero-description{margin-top:22px;font-size:13px;line-height:1.65}
  .hero-actions{margin-top:24px}
  .hero-actions .button{flex:1;min-width:190px}
  .hero-assurances{gap:9px;margin-top:19px;font-size:8px}
  .hero-visual-wrap{right:-330px;opacity:.2}
  .scroll-cue{bottom:17px;font-size:7px}

  .workspace-intro h2{font-size:34px}
  .workspace-intro>p{max-width:520px;font-size:11px}
  .panel{border-radius:16px}
  .upload-panel,.filters-panel{padding:16px}

  .local-badge{padding:5px 7px;font-size:0}

  .drop-zone{min-height:155px;padding:20px 13px}
  .drop-zone.is-compact{min-height:78px}
  .drop-copy strong{font-size:11px}
  .drop-copy span{font-size:9px}
  .empty-footer-actions{width:100%;flex-direction:column}
  .upload-summary{align-items:flex-start}
  .quality-notes{flex-direction:column}
  .filters-heading{flex-direction:column}
  .filter-header-actions{width:100%;justify-content:flex-start}
  .preset-control{flex:1}
  .preset-control select{width:100%}
  .filters-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .search-field{grid-column:1/-1}
  .advanced-filters-inner{grid-template-columns:1fr}
  .subject-search{width:100%;margin-left:0}
  .subject-search input{width:100%}
  .subject-chips{max-height:230px}
  .results-section-heading{align-items:flex-start;flex-direction:column;gap:6px}
  .kpi-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .kpi-card{min-height:150px;padding:13px}
  .kpi-card>strong{font-size:30px}
  .kpi-card:last-child{grid-column:1/-1;min-height:135px}
  .insights-layout{display:grid;grid-template-columns:1fr}
  .timeline-panel,.ranking-panel,.gap-panel,.pattern-panel{grid-column:1}
  .insight-card{padding:16px}
  .chart-readout strong{width:100%}
  .results-header{align-items:flex-start;flex-direction:column;padding:17px}

  .detail-animation{padding:0 12px 14px}
  .episode-strip{flex-direction:column}

  .pagination{flex-wrap:wrap;justify-content:flex-start}
  .pagination label{width:100%;margin-bottom:5px}
  .empty-guide,.schema-card{padding:20px}
  .methodology-section{padding:75px 0}
  .method-heading{grid-template-columns:1fr;gap:20px;margin-bottom:30px}
  .method-heading h2{font-size:40px}
  .method-copy{grid-template-columns:1fr}
  .rule-lab{padding:16px}
  .lab-timeline{height:210px}
  .lab-node>small{font-size:7px}
  .lab-gap-one{left:22%}
  .lab-gap-two{left:57%}
  .footer-grid{grid-template-columns:1fr;gap:28px}
  .footer-meta{grid-column:auto;flex-direction:column;gap:7px}
  .footer-bottom{gap:20px}
  .toast-region{right:13px;bottom:13px}
}
@media (max-width:430px){
  .brand-copy strong{font-size:13px}

  .theme-toggle,.mobile-menu-button{width:33px;height:33px}

  .filter-header-actions .button{font-size:9px}

  .kpi-detail{font-size:7px}

  .ranking-label small{font-size:6px}
  .results-actions .button{flex:1}

  .pattern-stats{grid-template-columns:1fr 1fr}
  .rule-lab-header{flex-direction:column}

  .lab-gap{font-size:7px}

}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}

}
@media print{

  body{background:#fff!important;color:#111!important;font-size:10px}

  .workspace{width:100%;padding:0}
  .results-panel{border:0;box-shadow:none}
  .results-header{padding:0 0 12px}
  .table-scroll,.inner-table-scroll{overflow:visible}

  .main-row,.detail-row{break-inside:avoid}
  .diagnostic-cell{min-width:0}
  .table-footer{display:none}
}

const DAY = 86400000;
const norm = (v) => String(v??"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]/g,"");
const normSearch = (v) => String(v??"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim();
const fmtDay = (day) => { if (day==null || !isFinite(day)) return "—"; const d = new Date(day*DAY);
  return String(d.getUTCDate()).padStart(2,"0")+"/"+String(d.getUTCMonth()+1).padStart(2,"0")+"/"+d.getUTCFullYear(); };
const fmtDT = (ms) => { if (ms==null || !isFinite(ms)) return "—"; const d = new Date(ms);
  return fmtDay(Math.floor(ms/DAY))+" "+String(d.getUTCHours()).padStart(2,"0")+":"+String(d.getUTCMinutes()).padStart(2,"0"); };
const isoDay = (day) => new Date(day*DAY).toISOString().slice(0,10);
const isoToDay = (v) => { if (!v) return null; const ms = Date.parse(v+"T00:00:00Z"); return isFinite(ms) ? Math.floor(ms/DAY) : null; };
const isAfterSales = (s) => /P[ÓO]S-?\s?VENDA/i.test(s);
const isRepair = (s) => /^(REPARO|TECNICO|SUPORTE)/i.test(s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-zA-Z0-9 ]/g,""));
const fmtNum = (n,d=0) => new Intl.NumberFormat("pt-BR",{maximumFractionDigits:d}).format(n||0);

const ALIASES = {
  id:["idos","idordemservico","ordemservico","numeroos"],
  cid:["idcliente","codcliente","codigocliente"],
  cliente:["clientes","cliente","nomecliente"],
  bairro:["bairro"], tecnico:["tecnicos","tecnico","responsaveltecnico"],
  filial:["filial","unidade","empresa"], assunto:["asssuntos","assuntos","assunto","tiposervico"],
  diag:["diagnostico","diagnosticos","laudo","solucao"],
  abertura:["dataaberturaos","dataabertura","aberturaos","dataabert"],
  fechamento:["datafechamentoos","datafechamento","fechamentoos","dataconclusao"],
  status:["statusos","status","situacaoos","situacao"]
};

function toMs(v) {
  if (v==null || v==="") return null;
  if (v instanceof Date && !isNaN(v.getTime())) return Date.UTC(v.getFullYear(),v.getMonth(),v.getDate(),v.getHours(),v.getMinutes(),v.getSeconds());
  if (typeof v==="number" && isFinite(v)) { const ms = Math.round((v-25569)*DAY); return ms>0 ? ms : null; }
  const s = String(v).trim();
  let m = s.match(/^(\d{1,2})[\/.](\d{1,2})[\/.](\d{4})(?:[ T](\d{1,2}):(\d{2})(?::(\d{2}))?)?/);
  if (m) { const ms = Date.UTC(+m[3],+m[2]-1,+m[1],+(m[4]||0),+(m[5]||0),+(m[6]||0));
    return validParts(ms,+m[3],+m[2]-1,+m[1]) ? ms : null; }
  m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:[ T](\d{1,2}):(\d{2})(?::(\d{2}))?)?/);
  if (m) { const ms = Date.UTC(+m[1],+m[2]-1,+m[3],+(m[4]||0),+(m[5]||0),+(m[6]||0));
    return validParts(ms,+m[1],+m[2]-1,+m[3]) ? ms : null; }
  return null;
}
function validParts(ms,y,m,d){ const dt=new Date(ms); return dt.getUTCFullYear()===y&&dt.getUTCMonth()===m&&dt.getUTCDate()===d; }

function readCsv(text) {
  const clean = text.replace(/^\uFEFF/,"");
  const first = clean.split(/\r?\n/,1)[0]||"";
  const sep = (first.match(/;/g)||[]).length >= (first.match(/,/g)||[]).length ? ";" : ",";
  const rows=[]; let row=[], cur="", q=false;
  for (let i=0;i<clean.length;i++){ const ch=clean[i];
    if (q){ if (ch==='"'){ if (clean[i+1]==='"'){ cur+='"'; i++; } else q=false; } else cur+=ch; }
    else if (ch==='"') q=true;
    else if (ch===sep){ row.push(cur); cur=""; }
    else if (ch==="\n"||ch==="\r"){ if (ch==="\r"&&clean[i+1]==="\n") i++;
      row.push(cur); rows.push(row); row=[]; cur=""; }
    else cur+=ch;
  }
  if (cur||row.length){ row.push(cur); rows.push(row); }
  return rows;
}

function rowsToRecords(rows, fileId) {
  let header=-1; const cols={};
  for (let i=0;i<Math.min(rows.length,20);i++){
    const names = (rows[i]||[]).map(norm);
    if (names.some(n=>ALIASES.cid.includes(n)) && names.some(n=>n.startsWith("dataabertura")||ALIASES.abertura.includes(n))) {
      header=i;
      for (const [k,aliases] of Object.entries(ALIASES)) { const idx=names.findIndex(n=>aliases.includes(n)); if (idx>=0) cols[k]=idx; }
      break;
    }
  }
  if (header<0) throw new Error("Cabeçalho não reconhecido: são necessárias as colunas IdCliente e DataAberturaOs.");
  const out=[]; let skipped=0;
  for (let i=header+1;i<rows.length;i++){
    const r=rows[i]||[]; const get=k=>cols[k]==null?null:r[cols[k]];
    const cid=get("cid"); const opening=toMs(get("abertura"));
    if (cid==null || String(cid).trim()==="" || opening==null) { if (r.some(c=>c!=null&&String(c).trim()!=="")) skipped++; continue; }
    const rawId=get("id");
    out.push({
      id: rawId==null||String(rawId).trim()==="" ? null : String(rawId).trim(),
      cid: String(cid).trim(),
      cliente: String(get("cliente")??"").trim()||"Cliente sem nome",
      bairro: String(get("bairro")??"").trim(),
      tecnico: String(get("tecnico")??"").trim(),
      filial: String(get("filial")??"").trim(),
      assunto: String(get("assunto")??"").trim()||"(sem assunto)",
      diag: String(get("diag")??"").trim(),
      status: String(get("status")??"").trim(),
      abertura: opening,
      fechamento: toMs(get("fechamento")),
      day: Math.floor(opening/DAY),
      fileId
    });
  }
  if (!out.length) throw new Error("Nenhuma OS válida foi encontrada abaixo do cabeçalho.");
  return {output:out, skipped};
}

async function parseOsFile(file) {
  const fileId = (typeof crypto!=="undefined" && crypto.randomUUID) ? crypto.randomUUID() : "f-"+Date.now()+"-"+Math.random().toString(16).slice(2);
  let rows;
  if (/\.csv$/i.test(file.name)) rows = readCsv(await file.text());
  else if (/\.(xlsx|xls)$/i.test(file.name)) {
    const wb = XLSX.read(await file.arrayBuffer(), {type:"array", cellDates:false});
    const sheet = wb.SheetNames[0];
    if (!sheet) throw new Error("A planilha não contém nenhuma aba.");
    rows = XLSX.utils.sheet_to_json(wb.Sheets[sheet], {header:1, raw:true, defval:null});
  } else throw new Error("Formato não suportado. Use .xlsx, .xls ou .csv.");
  const {output, skipped} = rowsToRecords(rows, fileId);
  return {id:fileId, name:file.name, rows:output, skipped, addedAt:Date.now()};
}

function buildDataset(files) {
  const seen=new Set(); const all=[]; const dupByFile={}; let dups=0, minDay=null, maxDay=null;
  for (const f of files){ dupByFile[f.id]=0;
    for (const row of f.rows){
      const key = row.id ? "os:"+row.id : null;
      if (key && seen.has(key)) { dups++; dupByFile[f.id]++; continue; }
      if (key) seen.add(key);
      all.push(row);
      minDay = minDay==null ? row.day : Math.min(minDay, row.day);
      maxDay = maxDay==null ? row.day : Math.max(maxDay, row.day);
    }
  }
  return {all, duplicates:dups, duplicateByFile:dupByFile, minDay, maxDay};
}

function matchesDim(rec, filter) { return filter.startsWith("(sem ") ? rec==="" : rec===filter; }
function numericId(id) { const n = Number(id); return isFinite(n) ? n : 0; }

function analyze(records, filters) {
  const from = isoToDay(filters.from); const to = isoToDay(filters.to);
  const win = Math.max(1, Math.floor(Number(filters.win)||30));
  const minOs = Math.max(2, Math.floor(Number(filters.minOs)||2));
  const groups = new Map(); const filtered = []; const selected = new Set(filters.selectedSubjects);
  for (const rec of records) {
    if (from!=null && rec.day<from) continue;
    if (to!=null && rec.day>to) continue;
    if (filters.filial && !matchesDim(rec.filial, filters.filial)) continue;
    if (filters.bairro && !matchesDim(rec.bairro, filters.bairro)) continue;
    if (filters.status && rec.status !== filters.status) continue;
    if (filters.tecnico && !matchesDim(rec.tecnico, filters.tecnico)) continue;
    if (!selected.has(rec.assunto)) continue;
    filtered.push(rec);
    const list = groups.get(rec.cid) || []; list.push(rec); groups.set(rec.cid, list);
  }
  const recurrent=[]; const all=[];
  for (const [cid, list] of groups) {
    list.sort((a,b)=>a.abertura-b.abertura||numericId(a.id)-numericId(b.id));
    const gaps = list.map((r,i)=>i ? r.day - list[i-1].day : null);
    const near = gaps.map(g=>g!=null && g<win);
    const hit = list.map((_,i)=>Boolean((i>0 && near[i]) || (i<list.length-1 && near[i+1])));
    const n = hit.filter(Boolean).length;
    const nearGaps = gaps.filter(g=>g!=null && g<win);
    const hitIdx = hit.map((v,i)=>v?i:-1).filter(i=>i>=0);
    const episodes = buildEpisodes(list, gaps, win);
    const entry = {
      cid, cliente:list[0].cliente, bairro:list[0].bairro, filial:list[0].filial,
      list, gaps, hit, n, total:list.length,
      minGap: nearGaps.length ? nearGaps.reduce((m,g)=>Math.min(m,g), nearGaps[0]) : null,
      first: hitIdx.length ? list[hitIdx[0]].day : null,
      last: hitIdx.length ? list[hitIdx[hitIdx.length-1]].day : null,
      rec: n>=minOs, episodes, pairCount:nearGaps.length
    };
    all.push(entry); if (entry.rec) recurrent.push(entry);
  }
  return {res:recurrent, all, records:filtered, osInRange:filtered.length, clients:groups.size, win, minOs, from, to};
}

function buildEpisodes(list, gaps, win) {
  const eps=[]; let start=-1;
  for (let i=1;i<=list.length;i++){
    const conn = i<list.length && gaps[i]!=null && gaps[i]<win;
    if (conn && start<0) start=i-1;
    if (!conn && start>=0) {
      const end = i-1;
      const eGaps = gaps.slice(start+1,end+1).filter(g=>g!=null);
      eps.push({start,end,count:end-start+1,span:list[end].day-list[start].day,minGap:eGaps.reduce((m,g)=>Math.min(m,g),eGaps[0])});
      start=-1;
    }
  }
  return eps;
}

function filterAndSort(analysis, view, filters, sortKey, sortAsc) {
  const wide = view==="allc" || view==="allos";
  const q = normSearch(filters.q);
  const result = (wide ? analysis.all : analysis.res).filter(g=>{
    if (!q) return true;
    return normSearch(g.cliente).includes(q) || normSearch(g.cid).includes(q) || g.list.some(r=>normSearch(r.id).includes(q));
  });
  const dir = sortAsc ? 1 : -1;
  result.sort((a,b)=>{
    const v1 = (sortKey==="episodes" ? a.episodes.length : a[sortKey]) ?? -1;
    const v2 = (sortKey==="episodes" ? b.episodes.length : b[sortKey]) ?? -1;
    const cmp = typeof v1==="string" ? v1.localeCompare(String(v2),"pt-BR",{numeric:true}) : Number(v1)-Number(v2);
    return cmp*dir || a.cliente.localeCompare(b.cliente,"pt-BR") || a.cid.localeCompare(b.cid,"pt-BR");
  });
  return result;
}

function buildInsights(analysis) {
  const monthMap = new Map();
  for (const rec of analysis.records) {
    const key = isoDay(rec.day).slice(0,7);
    const m = monthMap.get(key) || {clients:new Set(), osHit:0, totalOs:0};
    m.totalOs++; monthMap.set(key, m);
  }
  const nearGaps=[]; let longestEpisode=0;
  const rkSets = {assunto:new Map(), filial:new Map(), tecnico:new Map(), bairro:new Map()};
  for (const g of analysis.res) {
    for (const ep of g.episodes) longestEpisode = Math.max(longestEpisode, ep.count);
    for (const gap of g.gaps) if (gap!=null && gap<analysis.win) nearGaps.push(gap);
    g.list.forEach((rec, i)=>{
      const key = isoDay(rec.day).slice(0,7);
      const m = monthMap.get(key) || {clients:new Set(), osHit:0, totalOs:0};
      if (g.hit[i]) {
        m.clients.add(g.cid); m.osHit++;
        const dims = [["assunto",rec.assunto],["filial",rec.filial||"(sem filial)"],["tecnico",rec.tecnico||"(sem técnico)"],["bairro",rec.bairro||"(sem bairro)"]];
        for (const [dim, label] of dims) {
          const r = rkSets[dim].get(label) || {clients:new Set(), os:0};
          r.clients.add(g.cid); r.os++; rkSets[dim].set(label, r);
        }
      }
      monthMap.set(key, m);
    });
  }
  const timeline = [...monthMap.entries()].sort(([a],[b])=>a.localeCompare(b)).map(([key, v])=>({
    key,
    label: new Intl.DateTimeFormat("pt-BR",{month:"short",year:"2-digit",timeZone:"UTC"}).format(new Date(key+"-01T00:00:00Z")).replace(" de "," "),
    clients: v.clients.size, osHit: v.osHit, totalOs: v.totalOs
  }));
  const binCount = Math.min(6, Math.max(1, analysis.win));
  const gapBins = Array.from({length:binCount}, (_,i)=>{
    const from = Math.floor(i*analysis.win/binCount);
    const to = Math.floor((i+1)*analysis.win/binCount)-1;
    return {from, to: Math.max(from,to), label: from===to ? `${from}` : `${from}–${Math.max(from,to)}`, count:0};
  });
  for (const gap of nearGaps) { const idx = Math.min(binCount-1, Math.floor(gap*binCount/analysis.win)); gapBins[Math.max(0,idx)].count++; }
  const rankings = {};
  for (const dim of Object.keys(rkSets)) {
    rankings[dim] = [...rkSets[dim].entries()].map(([label,v])=>({label, clients:v.clients.size, os:v.os}))
      .sort((a,b)=>b.clients-a.clients||b.os-a.os||a.label.localeCompare(b.label,"pt-BR"));
  }
  const sortedGaps = [...nearGaps].sort((a,b)=>a-b);
  const mid = Math.floor(sortedGaps.length/2);
  const medianGap = sortedGaps.length ? (sortedGaps.length%2 ? sortedGaps[mid] : (sortedGaps[mid-1]+sortedGaps[mid])/2) : null;
  return {
    timeline, gapBins, rankings,
    avgGap: nearGaps.length ? nearGaps.reduce((s,g)=>s+g,0)/nearGaps.length : null,
    medianGap, sameDay: nearGaps.filter(g=>g===0).length, longestEpisode
  };
}

const csvCell = (v) => { const t = String(v??""); return /[";\n\r]/.test(t) ? '"'+t.replace(/"/g,'""')+'"' : t; };
function groupsToCsv(groups, view, win, fileNames) {
  const headers = ["IdCliente","Cliente","Bairro","Filial","OS na janela","OS no período","Ciclos","IdOs","Abertura","Dias desde a anterior","Assunto","Diagnóstico","Técnico","Status","Fechamento","Dentro da regra (< "+win+" dias)","Arquivo de origem"];
  const lines = [headers];
  for (const g of groups) {
    g.list.forEach((rec, i)=>{
      if (view==="oshit" && !g.hit[i]) return;
      lines.push([g.cid,g.cliente,g.bairro,g.filial,g.n,g.total,g.episodes.length,rec.id,fmtDT(rec.abertura),g.gaps[i]??"",rec.assunto,rec.diag,rec.tecnico,rec.status,fmtDT(rec.fechamento),g.hit[i]?"Sim":"Não",fileNames[rec.fileId]||rec.fileId]);
    });
  }
  return "\uFEFF"+lines.map(l=>l.map(csvCell).join(";")).join("\r\n");
}
function downloadText(content, filename, type) {
  const blob = new Blob([content],{type:type||"text/csv;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}
